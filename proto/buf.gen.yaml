version: v2
managed:
  enabled: true

plugins:
  # OpenAPI spec generation
  - remote: buf.build/community/sudorandom-connect-openapi:v0.28.0
    out: ../apps/default
    opt:
      - features=connectrpc;gnostic;protovalidate
      - content-types=json
      - allow-get

  # Dart protobuf generation. v22.x is the newest line whose output runs on
  # protobuf 4.x; v23+ needs protobuf 5/6, and the antinvestor_api_* SDKs the
  # app also depends on still pin protobuf ^4.2.0 and connectrpc ^1.0.0.
  - remote: buf.build/protocolbuffers/dart:v22.5.0
    out: ../sdk/dart/chat/lib/src
    include_imports: true
    include_wkt: true

  # Dart ConnectRPC generation. v1.0.0 targets connectrpc 1.x (v2 needs
  # protobuf 6); pinned so an unversioned remote does not jump majors.
  - remote: buf.build/connectrpc/dart:v1.0.0
    out: ../sdk/dart/chat/lib/src
    include_imports: true
    include_wkt: true
