syntax = "proto3";

package chat.v1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/antinvestor/apis/go/chat/v1;chatv1";
option java_multiple_files = true;
option java_package = "chatv1";

// Allowed message types. Extendable via new enum values; clients must ignore unknown values.
enum PayloadType {
  PAYLOAD_TYPE_UNSPECIFIED = 0;
  PAYLOAD_TYPE_ROOM_CHANGE = 1;
  PAYLOAD_TYPE_TEXT = 2;
  PAYLOAD_TYPE_ATTACHMENT = 3;
  PAYLOAD_TYPE_REACTION = 7;
  PAYLOAD_TYPE_ENCRYPTED = 6; // opaque ciphertext
  PAYLOAD_TYPE_CALL = 20;
  PAYLOAD_TYPE_MODERATION = 21;
  PAYLOAD_TYPE_MOTION = 22;
  PAYLOAD_TYPE_VOTE = 23;
  PAYLOAD_TYPE_MOTION_TALLY = 24;
  PAYLOAD_TYPE_VOTE_TALLY = 25;
  PAYLOAD_TYPE_FORM_REQUEST = 30;
  PAYLOAD_TYPE_FORM_SUBMISSION_RESULT = 31;
}

enum RoomChangeAction {
  ROOM_CHANGE_ACTION_UNSPECIFIED = 0;
  ROOM_CHANGE_ACTION_CREATED = 1;
  ROOM_CHANGE_ACTION_UPDATED = 2;
  ROOM_CHANGE_ACTION_DELETED = 3;
  ROOM_CHANGE_ACTION_MEMBER_ADDED = 4;
  ROOM_CHANGE_ACTION_MEMBER_REMOVED = 5;
  ROOM_CHANGE_ACTION_ROLE_CHANGED = 6;
}

message RoomChangeContent {
  RoomChangeAction action = 1;
  string actor_subscription_id = 2;
  repeated string target_subscription_ids = 3;

  // Human-readable summary (server-generated, for display)
  string body = 4;

  // Optional structured detail (depends on action)
  google.protobuf.Struct details = 5;
}

message ModerationContent {
  // Human-readable message body describing the action.
  // Intended for display to end users.
  string body = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 10000
  ];

  // Subscription ID of the actor who initiated the action.
  string actor_subscription_id = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32
  ];

  // Subscription IDs of entities targeted by the action.
  // Must not contain duplicates and must not include the actor.
  repeated string target_subscription_ids = 3 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items = {
      string: {
        min_len: 3
        max_len: 40
        pattern: "[0-9a-z_-]{3,40}"
      }
    }
  ];

  // Optional structured metadata associated with the action.
  // Use only for non-indexed, auxiliary data.
  google.protobuf.Struct metadata = 8;

  // Optional language tag for the body, using BCP-47 (e.g. "en", "fr-CA").
  optional string language = 4 [(buf.validate.field).string.pattern = "^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,8})*$"];
}

message TextContent {
  // Required human-readable message body
  string body = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 10000
  ];

  // Content format identifier (NOT MIME type)
  // Examples: "plain", "markdown", "html-lite"
  string format = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32
  ];

  // Structured annotations for clients (mentions, links, emojis)
  repeated TextAnnotation annotations = 3;

  // Optional language hint (BCP-47), e.g. "en", "fr-CA"
  optional string lang = 4;
}

message TextAnnotation {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_MENTION_USER = 1;
    TYPE_MENTION_ROOM = 2;
    TYPE_LINK = 3;
    TYPE_EMOJI = 4;
    TYPE_HASHTAG = 5;
  }

  Type type = 1;

  // UTF-16 offset & length for cross-platform compatibility
  int32 offset = 2;
  int32 length = 3;

  // Target identifier (e.g., profile_id, room_id, URL)
  string value = 4;
}

message AttachmentContent {
  // Logical identifier of the attachment
  string attachment_id = 1;

  // Original filename (optional, user-facing)
  string filename = 2;

  // MIME type (e.g. image/png, application/pdf)
  string mime_type = 3;

  // Size in bytes (for quota enforcement & UX)
  int64 size_bytes = 4;

  // Content location (signed URL or opaque locator)
  string uri = 5;

  // Optional previews / thumbnails
  repeated AttachmentPreview previews = 6;

  // Optional caption text
  optional TextContent caption = 7;

  // Indicates whether attachment is end-to-end encrypted
  bool encrypted = 8;

  // Optional content hash (e.g. sha256:base64)
  optional string checksum = 9;
}

message AttachmentPreview {
  string mime_type = 1;
  int32 width = 2;
  int32 height = 3;
  string uri = 4;
  int64 size_bytes = 5;
}

message ReactionContent {
  // Target message being reacted to
  string target_event_id = 1 [(buf.validate.field).string.min_len = 3];

  // Reaction key (e.g. 👍, ❤️, :custom_emoji:)
  string reaction = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];

  // add=true → ensure reaction exists
  // add=false → ensure reaction does not exist
  bool add = 3;
}

message EncryptedContent {
  // Encryption scheme identifier
  // Examples: "olm.v2", "megolm.v1", "x25519-aesgcm"
  string algorithm = 1;

  // Base64 or binary-safe encoded ciphertext
  bytes ciphertext = 2;

  // Optional per-message nonce / IV
  optional bytes nonce = 3;

  // Optional sender key identifier
  optional string sender_key_id = 4;

  // Optional recipient key references (for fan-out)
  repeated string recipient_key_ids = 5;

  // Additional authenticated data (AAD)
  optional bytes aad = 6;

  // Optional key agreement context identifier
  optional string session_id = 7;
}

message CallContent {
  enum CallType {
    CALL_TYPE_UNSPECIFIED = 0;
    CALL_TYPE_AUDIO = 1;
    CALL_TYPE_VIDEO = 2;
    CALL_TYPE_SCREEN_SHARE = 3;
  }

  enum CallAction {
    CALL_ACTION_UNSPECIFIED = 0;
    CALL_ACTION_OFFER = 1;
    CALL_ACTION_ANSWER = 2;
    CALL_ACTION_ICE_CANDIDATE = 3;
    CALL_ACTION_END = 4;
  }

  string call_id = 1;
  CallType type = 2;

  // OFFER, ANSWER → sdp required
  // ICE_CANDIDATE → ice_candidate required
  // END → no payload required
  CallAction action = 3;

  // WebRTC payload (SDP or ICE candidate)
  optional string sdp = 4;

  // Optional ICE candidate (when action = ICE_CANDIDATE)
  optional string ice_candidate = 5;

  // Optional metadata (bitrate, codecs, device hints)
  google.protobuf.Struct metadata = 8;
}

message MotionContent {
  string id = 1;

  // Human-readable description
  string title = 2;
  string description = 3;

  // Roles allowed to vote; eligible_votes is derived
  repeated string eligible_roles = 13;

  // Snapshot of eligible voters at creation time (optional, cached)
  optional uint32 eligible_votes = 4;

  // Number of votes required to pass
  // Can represent absolute count or percentage thresholds
  // Passing rule
  PassingRule passing_rule = 7;

  // Available choices (YES / NO / ABSTAIN, etc)
  repeated VoteChoice choices = 8;

  // Optional deadline (unix seconds)
  optional int64 closes_at = 12;
}

message VoteChoice {
  string id = 1;
  string name = 2;
  optional string description = 3;
}

message PassingRule {
  oneof rule {
    // Absolute number of votes required
    uint32 absolute = 1;

    // Percentage required to pass (0–100)
    uint32 percentage = 2;
  }

  // Which choice constitutes "passing" (usually YES)
  string passing_choice_id = 3;
}

//    total_votes_cast = sum(choice counts excluding invalid if configured)
//    remaining_votes  = eligible_votes - total_votes_cast
//    dead_votes       = tally(choice_id == "invalid")
//    target_votes     = derived from PassingRule
//    passed           = tally(passing_choice_id) >= target_votes
message VoteCast {
  string motion_id = 1;

  // Selected choice
  string choice_id = 2;
}

message VoteTally {
  string choice_id = 1;
  uint32 count = 2;
}

message MotionTally {
  string motion_id = 1;

  // Total eligible voters
  uint32 eligible_votes = 2;

  // Votes per choice
  repeated VoteTally tallies = 3;

  // Derived counts
  uint32 total_votes_cast = 4;

  // Dead votes (invalid, expired, disqualified)
  uint32 dead_votes = 6;

  // Passing evaluation
  uint32 target_votes = 7;
  bool passed = 8;
  bool closed = 9;
}

enum FormMessageState {
  FORM_MESSAGE_STATE_UNSPECIFIED = 0;
  FORM_MESSAGE_STATE_OPEN = 1;
  FORM_MESSAGE_STATE_IN_REVIEW = 2;
  FORM_MESSAGE_STATE_SUBMITTING = 3;
  FORM_MESSAGE_STATE_SUBMITTED = 4;
  FORM_MESSAGE_STATE_FAILED_SUBMISSION = 5;
  FORM_MESSAGE_STATE_EXPIRED = 6;
  FORM_MESSAGE_STATE_CANCELLED = 7;
}

enum FormFieldType {
  FORM_FIELD_TYPE_UNSPECIFIED = 0;
  FORM_FIELD_TYPE_TEXT = 1;
  FORM_FIELD_TYPE_MULTILINE = 2;
  FORM_FIELD_TYPE_NUMBER = 3;
  FORM_FIELD_TYPE_DECIMAL = 4;
  FORM_FIELD_TYPE_CURRENCY = 5;
  FORM_FIELD_TYPE_PHONE = 6;
  FORM_FIELD_TYPE_EMAIL = 7;
  FORM_FIELD_TYPE_DATE = 8;
  FORM_FIELD_TYPE_DATETIME = 9;
  FORM_FIELD_TYPE_SELECT = 10;
  FORM_FIELD_TYPE_RADIO = 11;
  FORM_FIELD_TYPE_CHECKBOX_GROUP = 12;
  FORM_FIELD_TYPE_BOOLEAN = 13;
  FORM_FIELD_TYPE_FILE = 14;
  FORM_FIELD_TYPE_ADDRESS = 15;
  FORM_FIELD_TYPE_REPEATABLE_GROUP = 16;
  FORM_FIELD_TYPE_GROUP = 17;
  FORM_FIELD_TYPE_SECTION = 18;
  FORM_FIELD_TYPE_HIDDEN = 19;
  FORM_FIELD_TYPE_COMPUTED = 20;
}

enum FormConditionOperator {
  FORM_CONDITION_OPERATOR_UNSPECIFIED = 0;
  FORM_CONDITION_OPERATOR_EQUALS = 1;
  FORM_CONDITION_OPERATOR_NOT_EQUALS = 2;
  FORM_CONDITION_OPERATOR_GREATER_THAN = 3;
  FORM_CONDITION_OPERATOR_GREATER_THAN_OR_EQUAL = 4;
  FORM_CONDITION_OPERATOR_LESS_THAN = 5;
  FORM_CONDITION_OPERATOR_LESS_THAN_OR_EQUAL = 6;
  FORM_CONDITION_OPERATOR_IN = 7;
  FORM_CONDITION_OPERATOR_NOT_IN = 8;
  FORM_CONDITION_OPERATOR_CONTAINS = 9;
  FORM_CONDITION_OPERATOR_NOT_CONTAINS = 10;
  FORM_CONDITION_OPERATOR_IS_TRUE = 11;
  FORM_CONDITION_OPERATOR_IS_FALSE = 12;
  FORM_CONDITION_OPERATOR_EXISTS = 13;
  FORM_CONDITION_OPERATOR_NOT_EXISTS = 14;
}

message FormValidationRule {
  string code = 1;
  string message = 2;

  oneof rule {
    bool required = 3;
    int32 min_length = 4;
    int32 max_length = 5;
    double min_value = 6;
    double max_value = 7;
    string pattern = 8;
    int32 min_items = 9;
    int32 max_items = 10;
  }
}

message FormConditionClause {
  string field_key = 1;
  FormConditionOperator operator = 2;
  google.protobuf.Value value = 3;
  repeated google.protobuf.Value values = 4;
}

message FormConditionGroup {
  repeated FormConditionClause all = 1;
  repeated FormConditionClause any = 2;
}

message FormOption {
  string value = 1;
  string label = 2;
  string help_text = 3;
  bool disabled = 4;
  google.protobuf.Struct metadata = 5;
}

message FormFormattingHint {
  string input_mask = 1;
  string display_format = 2;
  string currency_code = 3;
  int32 decimal_scale = 4;
  string keyboard = 5;
  string autocomplete = 6;
}

message FormReviewHint {
  bool include_in_review = 1;
  string label = 2;
  string section_label = 3;
  string formatter = 4;
  int32 order = 5;
}

message FormField {
  string key = 1;
  FormFieldType type = 2;
  string label = 3;
  string help_text = 4;
  string placeholder = 5;
  bool required = 6;
  google.protobuf.Value default_value = 7;
  repeated FormValidationRule validation_rules = 8;
  FormConditionGroup visibility_condition = 9;
  FormConditionGroup editability_condition = 10;
  repeated FormOption options = 11;
  repeated FormField nested_fields = 12;
  repeated FormSection nested_sections = 13;
  FormFormattingHint formatting = 14;
  google.protobuf.Struct ui_hints = 15;
  FormReviewHint review = 16;
  repeated string visible_to_roles = 17;
  bool repeatable = 18;
  bool hidden = 19;
}

message FormSection {
  string id = 1;
  string title = 2;
  string description = 3;
  repeated FormField fields = 4;
  google.protobuf.Struct ui_hints = 5;
}

message FormStep {
  string id = 1;
  string title = 2;
  string description = 3;
  repeated FormSection sections = 4;
  google.protobuf.Struct ui_hints = 5;
  FormConditionGroup visibility_condition = 6;
}

message FormSchema {
  string form_id = 1;
  int32 form_version = 2;
  string title = 3;
  string subtitle = 4;
  string description = 5;
  repeated FormStep steps = 6;
  google.protobuf.Struct workflow_metadata = 7;
  google.protobuf.Struct ui_hints = 8;
}

message FormPermissions {
  bool can_edit = 1;
  bool can_submit = 2;
  bool can_save_draft = 3;
  bool can_go_back = 4;
  string assignee_subscription_id = 5;
}

message FormReviewItem {
  string field_key = 1;
  string label = 2;
  string display_value = 3;
  bool emphasized = 4;
}

message FormReviewSection {
  string step_id = 1;
  string step_title = 2;
  string section_id = 3;
  string section_title = 4;
  repeated FormReviewItem items = 5;
}

message FormSubmissionSnapshot {
  string form_instance_id = 1;
  string schema_id = 2;
  int32 schema_version = 3;
  google.protobuf.Timestamp submitted_at = 4;
  string submitted_by_subscription_id = 5;
  google.protobuf.Struct answers = 6;
  repeated FormReviewSection formatted_sections = 7;
  string submission_reference = 8;
  FormMessageState status = 9;
  string backend_message = 10;
  string workflow_message = 11;
  google.protobuf.Struct metadata = 12;
}

message FormRequestContent {
  string form_instance_id = 1;
  string schema_id = 2;
  int32 schema_version = 3;
  string title = 4;
  string description = 5;
  FormMessageState state = 6;
  bool review_required = 7;
  FormSchema schema = 8;
  google.protobuf.Struct initial_values = 9;
  google.protobuf.Struct server_draft_values = 10;
  FormSubmissionSnapshot final_submission_snapshot = 11;
  FormPermissions permissions = 12;
  google.protobuf.Timestamp expires_at = 13;
  google.protobuf.Struct workflow_context = 14;
  string current_workflow_state = 15;
}

message FormSubmissionResultContent {
  string form_instance_id = 1;
  string schema_id = 2;
  int32 schema_version = 3;
  string source_event_id = 4;
  FormMessageState state = 5;
  bool review_confirmed = 6;
  FormSubmissionSnapshot submission_snapshot = 7;
  google.protobuf.Struct metadata = 8;
}

message Payload {
  // The `type` MUST correspond to the populated payload.
  // Servers MUST reject mismatches.
  PayloadType type = 1;

  oneof data {
    // type = PAYLOAD_TYPE_UNSPECIFIED
    google.protobuf.Struct default = 7;

    // type = PAYLOAD_TYPE_ROOM_CHANGE
    RoomChangeContent room_change = 8;

    // type = PAYLOAD_TYPE_MODERATION
    ModerationContent moderation = 10;

    // type = PAYLOAD_TYPE_TEXT
    TextContent text = 15;

    // type = PAYLOAD_TYPE_ATTACHMENT
    AttachmentContent attachment = 16;

    // type = PAYLOAD_TYPE_REACTION
    ReactionContent reaction = 17;

    // type = PAYLOAD_TYPE_ENCRYPTED
    EncryptedContent encrypted = 18;

    // type = PAYLOAD_TYPE_CALL
    CallContent call = 19;

    // type = PAYLOAD_TYPE_MOTION
    MotionContent motion = 25;

    // type = PAYLOAD_TYPE_MOTION_TALLY
    MotionTally motion_tally = 28;

    // type = PAYLOAD_TYPE_VOTE
    VoteCast vote = 26;
    // type = PAYLOAD_TYPE_VOTE_TALLY
    VoteTally vote_tally = 29;

    // type = PAYLOAD_TYPE_FORM_REQUEST
    FormRequestContent form_request = 30;

    // type = PAYLOAD_TYPE_FORM_SUBMISSION_RESULT
    FormSubmissionResultContent form_submission_result = 31;
  }
}
