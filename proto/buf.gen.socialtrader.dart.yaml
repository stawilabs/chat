# Vendors the socialtrader.v1 Dart clients into the chat app, for the trading
# group module (ui/lib/features/socialtrader). The protos live in the
# socialtrader repository and are not yet on the BSR, so they are generated
# from a checkout of that repository's proto directory. Run from this
# repository's root:
#
#   buf generate /home/j/code/stawilabs/socialtrader-service/proto \
#     --template proto/buf.gen.socialtrader.dart.yaml
#
# As for sdk/dart/chat: the well-known types come from
# package:protobuf/well_known_types, so the copies include_wkt writes under
# google/protobuf are deleted afterwards (descriptor stays, buf.validate and
# gnostic import it relatively), as are the .pbserver.dart files.
version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/dart:v25.1.0
    out: ui/lib/features/socialtrader/data/gen
    include_imports: true
    include_wkt: true
  - remote: buf.build/connectrpc/dart:v2.0.0
    out: ui/lib/features/socialtrader/data/gen
    include_imports: true
    include_wkt: true
