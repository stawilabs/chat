        genesisId:
          type: string
          title: genesis_id
          maxLength: 64
        state:
          allOf:
            - $ref: '#/components/schemas/chat.v1.StawiCallOutcomeState'
          title: state
          description: |
            enum.defined_only = true
        reason:
          type: string
          title: reason
          maxLength: 1024
          description: Why a FAILED outcome failed.
        sourceEventId:
          type: string
          title: source_event_id
          maxLength: 40
          description: The chat event that carried the act, when the act came through chat.
        kind:
          type: string
          title: kind
          maxLength: 64
          description: The call kind, or the chain event an OBSERVED outcome reports.
        chainId:
          type: string
          title: chain_id
          format: int64
          description: Where an OBSERVED outcome was seen on chain.
        txHash:
          type: string
          title: tx_hash
          maxLength: 32
          format: byte
        blockNumber:
          type: string
          title: block_number
          format: int64
        logIndex:
          type: string
          title: log_index
          format: int64
      title: StawiCallOutcomeContent
      additionalProperties: false
      description: |-
        StawiCallOutcomeContent is server-generated: what became of a conversion,
         a genesis signature or a signed call. Clients cannot send it.
    chat.v1.StawiCallOutcomeState:
      type: string
      title: StawiCallOutcomeState
      enum:
        - STAWI_CALL_OUTCOME_STATE_UNSPECIFIED
        - STAWI_CALL_OUTCOME_STATE_ACCEPTED
        - STAWI_CALL_OUTCOME_STATE_FAILED
        - STAWI_CALL_OUTCOME_STATE_OBSERVED
    chat.v1.StawiGenesis:
      type: object
      properties:
        genesisId:
          type: string
          title: genesis_id
          maxLength: 64
        genesisHash:
          type: string
          title: genesis_hash
          maxLength: 32
          format: byte
          description: The digest each founder's device signs (account-wrapped by the app).
        constitutionHash:
          type: string
          title: constitution_hash
          maxLength: 32
          format: byte
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
        founderProfileIds:
          type: array
          items:
            type: string
          title: founder_profile_ids
          maxItems: 64
      title: StawiGenesis
      additionalProperties: false
      description: StawiGenesis is a prepared room genesis awaiting founder signatures.
    chat.v1.StawiGenesisSignatureContent:
      type: object
      properties:
        genesisId:
          type: string
          title: genesis_id
          maxLength: 64
          minLength: 1
        signature:
          type: string
          title: signature
          maxLength: 132
          minLength: 64
          format: byte
          description: |-
            The device signature over the founder's signing digest: secp256k1
             (65 bytes) or P-256 (x ‖ y ‖ r ‖ s) for WebAuthn.
        signerKeyId:
          type: string
          title: signer_key_id
          maxLength: 128
          minLength: 1
          description: The device key that produced the signature.
        algorithm:
          type: string
          title: algorithm
          enum:
            - secp256k1
            - p256-webauthn
          description: '"secp256k1" or "p256-webauthn".'
        webauthnAuthenticatorData:
          type: string
          title: webauthn_authenticator_data
          maxLength: 4096
          format: byte
          description: WebAuthn assertion material; empty for secp256k1.
        webauthnClientDataJson:
          type: string
          title: webauthn_client_data_json
          maxLength: 4096
          format: byte
      title: StawiGenesisSignatureContent
      additionalProperties: false
      description: |-
        StawiGenesisSignatureContent is a founder's signature over a prepared
         genesis. Chat checks the sender is one of the genesis founders and hands
         the signature to settlement; at founding quorum settlement creates the
         room on chain.
    chat.v1.StawiJoinPolicy:
      type: string
      title: StawiJoinPolicy
      enum:
        - STAWI_JOIN_POLICY_UNSPECIFIED
        - STAWI_JOIN_POLICY_PRIVATE
        - STAWI_JOIN_POLICY_PUBLIC
      description: StawiJoinPolicy is how someone may enter a Stawi room once it is on chain.
    chat.v1.StawiRoomBinding:
      type: object
      properties:
        state:
          allOf:
            - $ref: '#/components/schemas/chat.v1.StawiRoomState'
          title: state
        genesisId:
          type: string
          title: genesis_id
          description: The latest genesis prepared for the room.
        genesisEventId:
          type: string
          title: genesis_event_id
          description: The room event (stawi room conversion) that carries the genesis card.
        genesisExpiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: genesis_expires_at
          description: When the pending genesis expires; unset once bound.
        chainId:
          type: string
          title: chain_id
          format: int64
          description: The following are set once the room is bound.
        custodyAddress:
          type: string
          title: custody_address
          description: The room's RoomCustody contract address (0x-prefixed, lower case).
        governanceAddress:
          type: string
          title: governance_address
          description: The room's GovernanceModule address (0x-prefixed, lower case).
        policyEpoch:
          type: string
          title: policy_epoch
          format: int64
        boundAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: bound_at
      title: StawiRoomBinding
      additionalProperties: false
      description: |-
        StawiRoomBinding binds a chat room to its on-chain custody. The chain room
         id is the chat room id: one identifier names the room in chat, in finance
         and on chain.
    chat.v1.StawiRoomConversionContent:
      type: object
      properties:
        templateId:
          type: string
          title: template_id
          maxLength: 64
          minLength: 1
          description: Constitution template the rules are applied to.
        ruleValues:
          type: object
          title: rule_values
          maxProperties: 64
          additionalProperties:
            type: string
            title: value
            maxLength: 256
          description: |-
            Rule values for the template, keyed by rule name. Values are strings
             (decimal numbers, durations, enum names); settlement parses and checks
             them against the template when it compiles the constitution.
        founderSubscriptionIds:
          type: array
          items:
            type: string
            maxLength: 40
            minLength: 3
            pattern: ^[0-9a-z_-]{3,40}$
          title: founder_subscription_ids
          maxItems: 64
          minItems: 1
          uniqueItems: true
          description: |-
            Subscriptions of this room whose holders found the Stawi room. Each must
             be an active subscription of the room.
        joinPolicy:
          allOf:
            - $ref: '#/components/schemas/chat.v1.StawiJoinPolicy'
          not:
            enum:
              - STAWI_JOIN_POLICY_UNSPECIFIED
          title: join_policy
          description: |
            enum.defined_only = true
        genesis:
          allOf:
            - $ref: '#/components/schemas/chat.v1.StawiGenesis'
          title: genesis
          description: |-
            Output only: the genesis settlement prepared. Set by the server on the
             stored event; a client that sets it is refused.
      title: StawiRoomConversionContent
      additionalProperties: false
      description: |-
        StawiRoomConversionContent asks for this room to become a Stawi room: the
         chain creates custody for the room under the room's own id once the
         founders have signed the genesis. Chat relays the request to settlement,
         which compiles the constitution and prepares the genesis; chat then fills
         in `genesis` on the stored event, so the event itself is the genesis card.
    chat.v1.StawiRoomState:
      type: string
      title: StawiRoomState
      enum:
        - STAWI_ROOM_STATE_UNSPECIFIED
        - STAWI_ROOM_STATE_PENDING
        - STAWI_ROOM_STATE_BOUND
        - STAWI_ROOM_STATE_FAILED
      description: StawiRoomState is where a room's conversion to a Stawi room stands.
    chat.v1.StawiSignedCallContent:
      type: object
      properties:
        callId:
          type: string
          title: call_id
          maxLength: 64
          minLength: 1
          description: The call id settlement returned when the call was prepared.
        kind:
          type: string
          title: kind
          maxLength: 64
          minLength: 1
          description: The call kind, as settlement names it (e.g. "INVITE", "CAST_VOTE").
        signature:
          type: string
          title: signature
          maxLength: 132
          minLength: 64
          format: byte
          description: |-
            The device signature over the call's digest: secp256k1 (65 bytes) or
             P-256 (x ‖ y ‖ r ‖ s) for WebAuthn.
        signerKeyId:
          type: string
          title: signer_key_id
          maxLength: 128
          minLength: 1
          description: The device key that produced the signature.
        summary:
          type: string
          title: summary
          maxLength: 512
          description: Human-readable description of the act, for display.
        algorithm:
          type: string
          title: algorithm
          enum:
            - secp256k1
            - p256-webauthn
          description: '"secp256k1" or "p256-webauthn".'
        webauthnAuthenticatorData:
          type: string
          title: webauthn_authenticator_data
          maxLength: 4096
          format: byte
          description: WebAuthn assertion material; empty for secp256k1.
        webauthnClientDataJson:
          type: string
          title: webauthn_client_data_json
          maxLength: 4096
          format: byte
      title: StawiSignedCallContent
      additionalProperties: false
      description: |-
        StawiSignedCallContent carries a room governance call (invite, accept,
         join, admit, leave, suspend, roles, propose, vote, delegate, freeze) that
         the app prepared through settlement and signed with the device key. Chat
         checks the sender's subscription is the call's signer and relays it; the
         room changes only when the chain reports the call.
