components:
  schemas:
    base64:
      type: boolean
      examples:
        - false
      title: base64
      description: Specifies if the message query param is base64 encoded, which may be required for binary data
    chat.v1.AckEvent:
      type: object
      properties:
        roomId:
          type: string
          title: room_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
        eventId:
          type: array
          items:
            type: string
            maxLength: 40
            minLength: 3
            pattern: '[0-9a-z_-]{3,40}'
          title: event_id
          minItems: 1
        subscriptionId:
          type: string
          title: subscription_id
        ackAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: ack_at
        error:
          oneOf:
            - $ref: '#/components/schemas/common.v1.ErrorDetail'
            - type: "null"
          title: error
          description: if set, indicates failure reason for this event
      title: AckEvent
      additionalProperties: false
      description: |-
        Acknowledgement for event(s) received; server uses it to free ephemeral delivery buffers.
         ack_event_id: last event_id client processed (inclusive).
         If error is set, indicates the event failed to send/process correctly.
    chat.v1.AddRoomSubscriptionsRequest:
      type: object
      properties:
        roomId:
          type: string
          title: room_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
        members:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.RoomSubscription'
          title: members
          description: include roles if desired
      title: AddRoomSubscriptionsRequest
      additionalProperties: false
    chat.v1.AddRoomSubscriptionsResponse:
      type: object
      properties:
        roomId:
          type: string
          title: room_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
        error:
          allOf:
            - $ref: '#/components/schemas/common.v1.ErrorDetail'
          title: error
      title: AddRoomSubscriptionsResponse
      additionalProperties: false
    chat.v1.AttachmentContent:
      type: object
      properties:
        attachmentId:
          type: string
          title: attachment_id
          description: Logical identifier of the attachment
        filename:
          type: string
          title: filename
          description: Original filename (optional, user-facing)
        mimeType:
          type: string
          title: mime_type
          description: MIME type (e.g. image/png, application/pdf)
        sizeBytes:
          type: string
          title: size_bytes
          format: int64
          description: Size in bytes (for quota enforcement & UX)
        uri:
          type: string
          title: uri
          description: Content location (signed URL or opaque locator)
        previews:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.AttachmentPreview'
          title: previews
          description: Optional previews / thumbnails
        caption:
          oneOf:
            - $ref: '#/components/schemas/chat.v1.TextContent'
            - type: "null"
          title: caption
          description: Optional caption text
        encrypted:
          type: boolean
          title: encrypted
          description: Indicates whether attachment is end-to-end encrypted
        checksum:
          type:
            - string
            - "null"
          title: checksum
          description: Optional content hash (e.g. sha256:base64)
      title: AttachmentContent
      additionalProperties: false
    chat.v1.AttachmentPreview:
      type: object
      properties:
        mimeType:
          type: string
          title: mime_type
        width:
          type: integer
          title: width
          format: int32
        height:
          type: integer
          title: height
          format: int32
        uri:
          type: string
          title: uri
        sizeBytes:
          type: string
          title: size_bytes
          format: int64
      title: AttachmentPreview
      additionalProperties: false
    chat.v1.CallContent:
      type: object
      properties:
        callId:
          type: string
          title: call_id
        type:
          allOf:
            - $ref: '#/components/schemas/chat.v1.CallContent.CallType'
          title: type
        action:
          allOf:
            - $ref: '#/components/schemas/chat.v1.CallContent.CallAction'
          title: action
          description: |-
            OFFER, ANSWER → sdp required
             ICE_CANDIDATE → ice_candidate required
             END → no payload required
        sdp:
          type:
            - string
            - "null"
          title: sdp
          description: WebRTC payload (SDP or ICE candidate)
        iceCandidate:
          type:
            - string
            - "null"
          title: ice_candidate
          description: Optional ICE candidate (when action = ICE_CANDIDATE)
        metadata:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Struct'
          title: metadata
          description: Optional metadata (bitrate, codecs, device hints)
      title: CallContent
      additionalProperties: false
    chat.v1.CallContent.CallAction:
      type: string
      title: CallAction
      enum:
        - CALL_ACTION_UNSPECIFIED
        - CALL_ACTION_OFFER
        - CALL_ACTION_ANSWER
        - CALL_ACTION_ICE_CANDIDATE
        - CALL_ACTION_END
    chat.v1.CallContent.CallType:
      type: string
      title: CallType
      enum:
        - CALL_TYPE_UNSPECIFIED
        - CALL_TYPE_AUDIO
        - CALL_TYPE_VIDEO
        - CALL_TYPE_SCREEN_SHARE
    chat.v1.ClientCommand:
      type: object
      anyOf:
        - type: object
          properties:
            ack:
              allOf:
                - $ref: '#/components/schemas/chat.v1.AckEvent'
              title: ack
          title: ack
        - type: object
          properties:
            event:
              allOf:
                - $ref: '#/components/schemas/chat.v1.RoomEvent'
              title: event
          title: event
        - type: object
          properties:
            presence:
              allOf:
                - $ref: '#/components/schemas/chat.v1.PresenceEvent'
              title: presence
              description: send a presence message to a room
          title: presence
        - type: object
          properties:
            readMarker:
              allOf:
                - $ref: '#/components/schemas/chat.v1.ReadMarker'
              title: read_marker
          title: read_marker
        - type: object
          properties:
            receipt:
              allOf:
                - $ref: '#/components/schemas/chat.v1.ReceiptEvent'
              title: receipt
              description: receipt acknowledgement for message delivery
          title: receipt
        - type: object
          properties:
            typing:
              allOf:
                - $ref: '#/components/schemas/chat.v1.TypingEvent'
              title: typing
          title: typing
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - ack
              - required:
                  - event
              - required:
                  - presence
              - required:
                  - readMarker
              - required:
                  - receipt
              - required:
                  - typing
          - not:
              oneOf:
                - required:
                    - ack
                - required:
                    - event
                - required:
                    - presence
                - required:
                    - readMarker
                - required:
                    - receipt
                - required:
                    - typing
      title: ClientCommand
      description: |-
        ClientCommand represents durable state changes initiated by the client.
         Commands are validated, persisted, and broadcast as needed.
         ClientCommand results in at least one RoomEvent being emitted.
    chat.v1.CreateRoomRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          maxLength: 20
          minLength: 20
          pattern: ^[0-9a-v]{20}$
          description: |-
            Optional caller-supplied room identifier.

             A room is the entity: its id in chat, in the finance service and on chain
             is one value. When a room is created in finance first, the caller hands
             chat that id here; when it is omitted chat mints one as before. Creating
             the same id twice returns the room that already exists, so a caller may
             safely retry.

             The identifier format is the platform's own (an xid, as util.IDString
             mints): 20 characters over [0-9a-v]. Anything else is refused.
        name:
          type: string
          title: name
          maxLength: 200
          minLength: 2
        description:
          type: string
          title: description
        type:
          allOf:
            - $ref: '#/components/schemas/chat.v1.RoomType'
          title: type
        isPrivate:
          type: boolean
          title: is_private
        members:
          type: array
          items:
            $ref: '#/components/schemas/common.v1.ContactLink'
          title: members
          description: optional
        metadata:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Struct'
          title: metadata
        requiresApproval:
          type: boolean
          title: requires_approval
          description: If true, changes to this room require approval from owners before execution
      title: CreateRoomRequest
      additionalProperties: false
    chat.v1.CreateRoomResponse:
      type: object
      properties:
        room:
          allOf:
            - $ref: '#/components/schemas/chat.v1.Room'
          title: room
        error:
          allOf:
            - $ref: '#/components/schemas/common.v1.ErrorDetail'
          title: error
      title: CreateRoomResponse
      additionalProperties: false
    chat.v1.DeleteRoomRequest:
      type: object
      properties:
        roomId:
          type: string
          title: room_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
      title: DeleteRoomRequest
      additionalProperties: false
    chat.v1.DeleteRoomResponse:
      type: object
