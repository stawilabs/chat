openapi: 3.1.0
info:
  title: chat.v1
paths: {}
components:
  schemas:
    chat.v1.AttachmentContent:
      type: object
      properties:
        attachmentId:
          type: string
          title: attachment_id
          description: Logical identifier of the attachment
        filename:
          type: string
          title: filename
          description: Original filename (optional, user-facing)
        mimeType:
          type: string
          title: mime_type
          description: MIME type (e.g. image/png, application/pdf)
        sizeBytes:
          type:
            - integer
            - string
          title: size_bytes
          format: int64
          description: Size in bytes (for quota enforcement & UX)
        uri:
          type: string
          title: uri
          description: Content location (signed URL or opaque locator)
        previews:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.AttachmentPreview'
          title: previews
          description: Optional previews / thumbnails
        caption:
          oneOf:
            - $ref: '#/components/schemas/chat.v1.TextContent'
            - type: "null"
          title: caption
          description: Optional caption text
        encrypted:
          type: boolean
          title: encrypted
          description: Indicates whether attachment is end-to-end encrypted
        checksum:
          type:
            - string
            - "null"
          title: checksum
          description: Optional content hash (e.g. sha256:base64)
      title: AttachmentContent
      additionalProperties: false
    chat.v1.AttachmentPreview:
      type: object
      properties:
        mimeType:
          type: string
          title: mime_type
        width:
          type: integer
          title: width
          format: int32
        height:
          type: integer
          title: height
          format: int32
        uri:
          type: string
          title: uri
        sizeBytes:
          type:
            - integer
            - string
          title: size_bytes
          format: int64
      title: AttachmentPreview
      additionalProperties: false
    chat.v1.CallContent:
      type: object
      properties:
        callId:
          type: string
          title: call_id
        type:
          title: type
          $ref: '#/components/schemas/chat.v1.CallContent.CallType'
        action:
          title: action
          description: |-
            OFFER, ANSWER → sdp required
             ICE_CANDIDATE → ice_candidate required
             END → no payload required
          $ref: '#/components/schemas/chat.v1.CallContent.CallAction'
        sdp:
          type:
            - string
            - "null"
          title: sdp
          description: WebRTC payload (SDP or ICE candidate)
        iceCandidate:
          type:
            - string
            - "null"
          title: ice_candidate
          description: Optional ICE candidate (when action = ICE_CANDIDATE)
        metadata:
          title: metadata
          description: Optional metadata (bitrate, codecs, device hints)
          $ref: '#/components/schemas/google.protobuf.Struct'
      title: CallContent
      additionalProperties: false
    chat.v1.CallContent.CallAction:
      type: string
      title: CallAction
      enum:
        - CALL_ACTION_UNSPECIFIED
        - CALL_ACTION_OFFER
        - CALL_ACTION_ANSWER
        - CALL_ACTION_ICE_CANDIDATE
        - CALL_ACTION_END
    chat.v1.CallContent.CallType:
      type: string
      title: CallType
      enum:
        - CALL_TYPE_UNSPECIFIED
        - CALL_TYPE_AUDIO
        - CALL_TYPE_VIDEO
        - CALL_TYPE_SCREEN_SHARE
    chat.v1.EncryptedContent:
      type: object
      properties:
        algorithm:
          type: string
          title: algorithm
          description: |-
            Encryption scheme identifier
             Examples: "olm.v2", "megolm.v1", "x25519-aesgcm"
        ciphertext:
          type: string
          title: ciphertext
          format: byte
          description: Base64 or binary-safe encoded ciphertext
        nonce:
          type:
            - string
            - "null"
          title: nonce
          format: byte
          description: Optional per-message nonce / IV
        senderKeyId:
          type:
            - string
            - "null"
          title: sender_key_id
          description: Optional sender key identifier
        recipientKeyIds:
          type: array
          items:
            type: string
          title: recipient_key_ids
          description: Optional recipient key references (for fan-out)
        aad:
          type:
            - string
            - "null"
          title: aad
          format: byte
          description: Additional authenticated data (AAD)
        sessionId:
          type:
            - string
            - "null"
          title: session_id
          description: Optional key agreement context identifier
      title: EncryptedContent
      additionalProperties: false
    chat.v1.FormConditionClause:
      type: object
      properties:
        fieldKey:
          type: string
          title: field_key
        operator:
          title: operator
          $ref: '#/components/schemas/chat.v1.FormConditionOperator'
        value:
          title: value
          $ref: '#/components/schemas/google.protobuf.Value'
        values:
          type: array
          items:
            $ref: '#/components/schemas/google.protobuf.Value'
          title: values
      title: FormConditionClause
      additionalProperties: false
    chat.v1.FormConditionGroup:
      type: object
      properties:
        all:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.FormConditionClause'
          title: all
        any:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.FormConditionClause'
          title: any
      title: FormConditionGroup
      additionalProperties: false
    chat.v1.FormConditionOperator:
      type: string
      title: FormConditionOperator
      enum:
        - FORM_CONDITION_OPERATOR_UNSPECIFIED
        - FORM_CONDITION_OPERATOR_EQUALS
        - FORM_CONDITION_OPERATOR_NOT_EQUALS
        - FORM_CONDITION_OPERATOR_GREATER_THAN
        - FORM_CONDITION_OPERATOR_GREATER_THAN_OR_EQUAL
        - FORM_CONDITION_OPERATOR_LESS_THAN
        - FORM_CONDITION_OPERATOR_LESS_THAN_OR_EQUAL
        - FORM_CONDITION_OPERATOR_IN
        - FORM_CONDITION_OPERATOR_NOT_IN
        - FORM_CONDITION_OPERATOR_CONTAINS
        - FORM_CONDITION_OPERATOR_NOT_CONTAINS
        - FORM_CONDITION_OPERATOR_IS_TRUE
        - FORM_CONDITION_OPERATOR_IS_FALSE
        - FORM_CONDITION_OPERATOR_EXISTS
        - FORM_CONDITION_OPERATOR_NOT_EXISTS
    chat.v1.FormField:
      type: object
      properties:
        key:
          type: string
          title: key
        type:
          title: type
          $ref: '#/components/schemas/chat.v1.FormFieldType'
        label:
          type: string
          title: label
        helpText:
          type: string
          title: help_text
        placeholder:
          type: string
          title: placeholder
        required:
          type: boolean
          title: required
        defaultValue:
          title: default_value
          $ref: '#/components/schemas/google.protobuf.Value'
        validationRules:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.FormValidationRule'
          title: validation_rules
        visibilityCondition:
          title: visibility_condition
          $ref: '#/components/schemas/chat.v1.FormConditionGroup'
        editabilityCondition:
          title: editability_condition
          $ref: '#/components/schemas/chat.v1.FormConditionGroup'
        options:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.FormOption'
          title: options
        nestedFields:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.FormField'
          title: nested_fields
        nestedSections:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.FormSection'
          title: nested_sections
        formatting:
          title: formatting
          $ref: '#/components/schemas/chat.v1.FormFormattingHint'
        uiHints:
          title: ui_hints
          $ref: '#/components/schemas/google.protobuf.Struct'
        review:
          title: review
          $ref: '#/components/schemas/chat.v1.FormReviewHint'
        visibleToRoles:
          type: array
          items:
            type: string
          title: visible_to_roles
        repeatable:
          type: boolean
          title: repeatable
        hidden:
          type: boolean
          title: hidden
      title: FormField
      additionalProperties: false
    chat.v1.FormFieldType:
      type: string
      title: FormFieldType
      enum:
        - FORM_FIELD_TYPE_UNSPECIFIED
        - FORM_FIELD_TYPE_TEXT
        - FORM_FIELD_TYPE_MULTILINE
        - FORM_FIELD_TYPE_NUMBER
        - FORM_FIELD_TYPE_DECIMAL
        - FORM_FIELD_TYPE_CURRENCY
        - FORM_FIELD_TYPE_PHONE
        - FORM_FIELD_TYPE_EMAIL
        - FORM_FIELD_TYPE_DATE
        - FORM_FIELD_TYPE_DATETIME
        - FORM_FIELD_TYPE_SELECT
        - FORM_FIELD_TYPE_RADIO
        - FORM_FIELD_TYPE_CHECKBOX_GROUP
        - FORM_FIELD_TYPE_BOOLEAN
        - FORM_FIELD_TYPE_FILE
        - FORM_FIELD_TYPE_ADDRESS
        - FORM_FIELD_TYPE_REPEATABLE_GROUP
        - FORM_FIELD_TYPE_GROUP
        - FORM_FIELD_TYPE_SECTION
        - FORM_FIELD_TYPE_HIDDEN
        - FORM_FIELD_TYPE_COMPUTED
    chat.v1.FormFormattingHint:
      type: object
      properties:
        inputMask:
          type: string
          title: input_mask
        displayFormat:
          type: string
          title: display_format
        currencyCode:
          type: string
          title: currency_code
        decimalScale:
          type: integer
          title: decimal_scale
          format: int32
        keyboard:
          type: string
          title: keyboard
        autocomplete:
          type: string
          title: autocomplete
      title: FormFormattingHint
      additionalProperties: false
    chat.v1.FormMessageState:
      type: string
      title: FormMessageState
      enum:
        - FORM_MESSAGE_STATE_UNSPECIFIED
        - FORM_MESSAGE_STATE_OPEN
        - FORM_MESSAGE_STATE_IN_REVIEW
        - FORM_MESSAGE_STATE_SUBMITTING
        - FORM_MESSAGE_STATE_SUBMITTED
        - FORM_MESSAGE_STATE_FAILED_SUBMISSION
        - FORM_MESSAGE_STATE_EXPIRED
        - FORM_MESSAGE_STATE_CANCELLED
    chat.v1.FormOption:
      type: object
      properties:
        value:
          type: string
          title: value
        label:
          type: string
          title: label
        helpText:
          type: string
          title: help_text
        disabled:
          type: boolean
          title: disabled
        metadata:
          title: metadata
          $ref: '#/components/schemas/google.protobuf.Struct'
      title: FormOption
      additionalProperties: false
    chat.v1.FormPermissions:
      type: object
      properties:
        canEdit:
          type: boolean
          title: can_edit
        canSubmit:
          type: boolean
          title: can_submit
        canSaveDraft:
          type: boolean
          title: can_save_draft
        canGoBack:
          type: boolean
          title: can_go_back
        assigneeSubscriptionId:
          type: string
          title: assignee_subscription_id
      title: FormPermissions
      additionalProperties: false
    chat.v1.FormRequestContent:
      type: object
      properties:
        formInstanceId:
          type: string
          title: form_instance_id
        schemaId:
          type: string
          title: schema_id
        schemaVersion:
          type: integer
          title: schema_version
          format: int32
        title:
          type: string
          title: title
        description:
          type: string
          title: description
        state:
          title: state
          $ref: '#/components/schemas/chat.v1.FormMessageState'
        reviewRequired:
          type: boolean
          title: review_required
        schema:
          title: schema
          $ref: '#/components/schemas/chat.v1.FormSchema'
        initialValues:
          title: initial_values
          $ref: '#/components/schemas/google.protobuf.Struct'
        serverDraftValues:
          title: server_draft_values
          $ref: '#/components/schemas/google.protobuf.Struct'
        finalSubmissionSnapshot:
          title: final_submission_snapshot
          $ref: '#/components/schemas/chat.v1.FormSubmissionSnapshot'
        permissions:
          title: permissions
          $ref: '#/components/schemas/chat.v1.FormPermissions'
        expiresAt:
          title: expires_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        workflowContext:
          title: workflow_context
          $ref: '#/components/schemas/google.protobuf.Struct'
        currentWorkflowState:
          type: string
          title: current_workflow_state
      title: FormRequestContent
      additionalProperties: false
    chat.v1.FormReviewHint:
      type: object
      properties:
        includeInReview:
          type: boolean
          title: include_in_review
        label:
          type: string
          title: label
        sectionLabel:
          type: string
          title: section_label
        formatter:
          type: string
          title: formatter
        order:
          type: integer
          title: order
          format: int32
      title: FormReviewHint
      additionalProperties: false
    chat.v1.FormReviewItem:
      type: object
      properties:
        fieldKey:
          type: string
          title: field_key
        label:
          type: string
          title: label
        displayValue:
          type: string
          title: display_value
        emphasized:
          type: boolean
          title: emphasized
      title: FormReviewItem
      additionalProperties: false
    chat.v1.FormReviewSection:
      type: object
      properties:
        stepId:
          type: string
          title: step_id
        stepTitle:
          type: string
          title: step_title
        sectionId:
          type: string
          title: section_id
        sectionTitle:
          type: string
          title: section_title
        items:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.FormReviewItem'
          title: items
      title: FormReviewSection
      additionalProperties: false
    chat.v1.FormSchema:
      type: object
      properties:
        formId:
          type: string
          title: form_id
        formVersion:
          type: integer
          title: form_version
          format: int32
        title:
          type: string
          title: title
        subtitle:
          type: string
          title: subtitle
        description:
          type: string
          title: description
        steps:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.FormStep'
          title: steps
        workflowMetadata:
          title: workflow_metadata
          $ref: '#/components/schemas/google.protobuf.Struct'
        uiHints:
          title: ui_hints
          $ref: '#/components/schemas/google.protobuf.Struct'
      title: FormSchema
      additionalProperties: false
    chat.v1.FormSection:
      type: object
      properties:
        id:
          type: string
          title: id
        title:
          type: string
          title: title
        description:
          type: string
          title: description
        fields:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.FormField'
          title: fields
        uiHints:
          title: ui_hints
          $ref: '#/components/schemas/google.protobuf.Struct'
      title: FormSection
      additionalProperties: false
    chat.v1.FormStep:
      type: object
      properties:
        id:
          type: string
          title: id
        title:
          type: string
          title: title
        description:
          type: string
          title: description
        sections:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.FormSection'
          title: sections
        uiHints:
          title: ui_hints
          $ref: '#/components/schemas/google.protobuf.Struct'
        visibilityCondition:
          title: visibility_condition
          $ref: '#/components/schemas/chat.v1.FormConditionGroup'
      title: FormStep
      additionalProperties: false
    chat.v1.FormSubmissionResultContent:
      type: object
      properties:
        formInstanceId:
          type: string
          title: form_instance_id
        schemaId:
          type: string
          title: schema_id
        schemaVersion:
          type: integer
          title: schema_version
          format: int32
        sourceEventId:
          type: string
          title: source_event_id
        state:
          title: state
          $ref: '#/components/schemas/chat.v1.FormMessageState'
        reviewConfirmed:
          type: boolean
          title: review_confirmed
        submissionSnapshot:
          title: submission_snapshot
          $ref: '#/components/schemas/chat.v1.FormSubmissionSnapshot'
        metadata:
          title: metadata
          $ref: '#/components/schemas/google.protobuf.Struct'
      title: FormSubmissionResultContent
      additionalProperties: false
    chat.v1.FormSubmissionSnapshot:
      type: object
      properties:
        formInstanceId:
          type: string
          title: form_instance_id
        schemaId:
          type: string
          title: schema_id
        schemaVersion:
          type: integer
          title: schema_version
          format: int32
        submittedAt:
          title: submitted_at
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        submittedBySubscriptionId:
          type: string
          title: submitted_by_subscription_id
        answers:
          title: answers
          $ref: '#/components/schemas/google.protobuf.Struct'
        formattedSections:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.FormReviewSection'
          title: formatted_sections
        submissionReference:
          type: string
          title: submission_reference
        status:
          title: status
          $ref: '#/components/schemas/chat.v1.FormMessageState'
        backendMessage:
          type: string
          title: backend_message
        workflowMessage:
          type: string
          title: workflow_message
        metadata:
          title: metadata
          $ref: '#/components/schemas/google.protobuf.Struct'
      title: FormSubmissionSnapshot
      additionalProperties: false
    chat.v1.FormValidationRule:
      type: object
      allOf:
        - properties:
            code:
              type: string
              title: code
            message:
              type: string
              title: message
        - oneOf:
            - type: object
              properties:
                maxItems:
                  type: integer
                  title: max_items
                  format: int32
              title: max_items
              required:
                - maxItems
            - type: object
              properties:
                maxLength:
                  type: integer
                  title: max_length
                  format: int32
              title: max_length
              required:
                - maxLength
            - type: object
              properties:
                maxValue:
                  type: number
                  title: max_value
                  format: double
              title: max_value
              required:
                - maxValue
            - type: object
              properties:
                minItems:
                  type: integer
                  title: min_items
                  format: int32
              title: min_items
              required:
                - minItems
            - type: object
              properties:
                minLength:
                  type: integer
                  title: min_length
                  format: int32
              title: min_length
              required:
                - minLength
            - type: object
              properties:
                minValue:
                  type: number
                  title: min_value
                  format: double
              title: min_value
              required:
                - minValue
            - type: object
              properties:
                pattern:
                  type: string
                  title: pattern
              title: pattern
              required:
                - pattern
            - type: object
              properties:
                required:
                  type: boolean
                  title: required
              title: required
              required:
                - required
      title: FormValidationRule
      additionalProperties: false
    chat.v1.ModerationContent:
      type: object
      properties:
        body:
          type: string
          title: body
          maxLength: 10000
          minLength: 1
          description: |-
            Human-readable message body describing the action.
             Intended for display to end users.
        actorSubscriptionId:
          type: string
          title: actor_subscription_id
          maxLength: 32
          minLength: 1
          description: Subscription ID of the actor who initiated the action.
        targetSubscriptionIds:
          type: array
          items:
            type: string
            maxLength: 40
            minLength: 3
            pattern: '[0-9a-z_-]{3,40}'
          title: target_subscription_ids
          uniqueItems: true
          description: |-
            Subscription IDs of entities targeted by the action.
             Must not contain duplicates and must not include the actor.
        metadata:
          title: metadata
          description: |-
            Optional structured metadata associated with the action.
             Use only for non-indexed, auxiliary data.
          $ref: '#/components/schemas/google.protobuf.Struct'
        language:
          type:
            - string
            - "null"
          title: language
          pattern: ^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,8})*$
          description: Optional language tag for the body, using BCP-47 (e.g. "en", "fr-CA").
      title: ModerationContent
      additionalProperties: false
    chat.v1.MotionContent:
      type: object
      properties:
        id:
          type: string
          title: id
        title:
          type: string
          title: title
          description: Human-readable description
        description:
          type: string
          title: description
        eligibleRoles:
          type: array
          items:
            type: string
          title: eligible_roles
          description: Roles allowed to vote; eligible_votes is derived
        eligibleVotes:
          type:
            - integer
            - "null"
          title: eligible_votes
          description: Snapshot of eligible voters at creation time (optional, cached)
        passingRule:
          title: passing_rule
          description: |-
            Number of votes required to pass
             Can represent absolute count or percentage thresholds
             Passing rule
          $ref: '#/components/schemas/chat.v1.PassingRule'
        choices:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.VoteChoice'
          title: choices
          description: Available choices (YES / NO / ABSTAIN, etc)
        closesAt:
          type:
            - integer
            - string
            - "null"
          title: closes_at
          format: int64
          description: Optional deadline (unix seconds)
      title: MotionContent
      additionalProperties: false
    chat.v1.MotionTally:
      type: object
      properties:
        motionId:
          type: string
          title: motion_id
        eligibleVotes:
          type: integer
          title: eligible_votes
          description: Total eligible voters
        tallies:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.VoteTally'
          title: tallies
          description: Votes per choice
        totalVotesCast:
          type: integer
          title: total_votes_cast
          description: Derived counts
        deadVotes:
          type: integer
          title: dead_votes
          description: Dead votes (invalid, expired, disqualified)
        targetVotes:
          type: integer
          title: target_votes
          description: Passing evaluation
        passed:
          type: boolean
          title: passed
        closed:
          type: boolean
          title: closed
      title: MotionTally
      additionalProperties: false
    chat.v1.PassingRule:
      type: object
      allOf:
        - properties:
            passingChoiceId:
              type: string
              title: passing_choice_id
              description: Which choice constitutes "passing" (usually YES)
        - oneOf:
            - type: object
              properties:
                absolute:
                  type: integer
                  title: absolute
                  description: Absolute number of votes required
              title: absolute
              required:
                - absolute
            - type: object
              properties:
                percentage:
                  type: integer
                  title: percentage
                  description: Percentage required to pass (0–100)
              title: percentage
              required:
                - percentage
      title: PassingRule
      additionalProperties: false
    chat.v1.Payload:
      type: object
      allOf:
        - properties:
            type:
              title: type
              description: |-
                The `type` MUST correspond to the populated payload.
                 Servers MUST reject mismatches.
              $ref: '#/components/schemas/chat.v1.PayloadType'
        - oneOf:
            - type: object
              properties:
                attachment:
                  title: attachment
                  description: type = PAYLOAD_TYPE_ATTACHMENT
                  $ref: '#/components/schemas/chat.v1.AttachmentContent'
              title: attachment
              required:
                - attachment
            - type: object
              properties:
                call:
                  title: call
                  description: type = PAYLOAD_TYPE_CALL
                  $ref: '#/components/schemas/chat.v1.CallContent'
              title: call
              required:
                - call
            - type: object
              properties:
                default:
                  title: default
                  description: type = PAYLOAD_TYPE_UNSPECIFIED
                  $ref: '#/components/schemas/google.protobuf.Struct'
              title: default
              required:
                - default
            - type: object
              properties:
                encrypted:
                  title: encrypted
                  description: type = PAYLOAD_TYPE_ENCRYPTED
                  $ref: '#/components/schemas/chat.v1.EncryptedContent'
              title: encrypted
              required:
                - encrypted
            - type: object
              properties:
                formRequest:
                  title: form_request
                  description: type = PAYLOAD_TYPE_FORM_REQUEST
                  $ref: '#/components/schemas/chat.v1.FormRequestContent'
              title: form_request
              required:
                - formRequest
            - type: object
              properties:
                formSubmissionResult:
                  title: form_submission_result
                  description: type = PAYLOAD_TYPE_FORM_SUBMISSION_RESULT
                  $ref: '#/components/schemas/chat.v1.FormSubmissionResultContent'
              title: form_submission_result
              required:
                - formSubmissionResult
            - type: object
              properties:
                moderation:
                  title: moderation
                  description: type = PAYLOAD_TYPE_MODERATION
                  $ref: '#/components/schemas/chat.v1.ModerationContent'
              title: moderation
              required:
                - moderation
            - type: object
              properties:
                motion:
                  title: motion
                  description: type = PAYLOAD_TYPE_MOTION
