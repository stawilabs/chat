    chat.v1.PresenceStatus:
      type: string
      title: PresenceStatus
      enum:
        - PRESENCE_STATUS_UNSPECIFIED
        - PRESENCE_STATUS_OFFLINE
        - PRESENCE_STATUS_ONLINE
    chat.v1.ReactionContent:
      type: object
      properties:
        targetEventId:
          type: string
          title: target_event_id
          minLength: 3
          description: Target message being reacted to
        reaction:
          type: string
          title: reaction
          maxLength: 64
          minLength: 1
          description: "Reaction key (e.g. \U0001F44D, ❤️, :custom_emoji:)"
        add:
          type: boolean
          title: add
          description: |-
            add=true → ensure reaction exists
             add=false → ensure reaction does not exist
      title: ReactionContent
      additionalProperties: false
    chat.v1.ReadMarker:
      type: object
      properties:
        roomId:
          type:
            - string
            - "null"
          title: room_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
        upToEventId:
          type: string
          title: up_to_event_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
        subscriptionId:
          type: string
          title: subscription_id
      title: ReadMarker
      additionalProperties: false
    chat.v1.ReceiptEvent:
      type: object
      properties:
        roomId:
          type: string
          title: room_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
        eventId:
          type: array
          items:
            type: string
            maxLength: 40
            minLength: 3
            pattern: '[0-9a-z_-]{3,40}'
          title: event_id
          minItems: 1
        subscriptionId:
          type: string
          title: subscription_id
      title: ReceiptEvent
      additionalProperties: false
      description: |-
        ReceiptEvent is OPTIONAL and ephemeral.
         Servers MAY ignore it.
         Clients SHOULD prefer ReadMarker for durable state.
         Servers MUST NOT persist ReceiptEvent.
         Servers MAY drop ReceiptEvent without acknowledgment.
    chat.v1.RoomChangeAction:
      type: string
      title: RoomChangeAction
      enum:
        - ROOM_CHANGE_ACTION_UNSPECIFIED
        - ROOM_CHANGE_ACTION_CREATED
        - ROOM_CHANGE_ACTION_UPDATED
        - ROOM_CHANGE_ACTION_DELETED
        - ROOM_CHANGE_ACTION_MEMBER_ADDED
        - ROOM_CHANGE_ACTION_MEMBER_REMOVED
        - ROOM_CHANGE_ACTION_ROLE_CHANGED
    chat.v1.RoomChangeContent:
      type: object
      properties:
        action:
          allOf:
            - $ref: '#/components/schemas/chat.v1.RoomChangeAction'
          title: action
        actorSubscriptionId:
          type: string
          title: actor_subscription_id
        targetSubscriptionIds:
          type: array
          items:
            type: string
          title: target_subscription_ids
        body:
          type: string
          title: body
          description: Human-readable summary (server-generated, for display)
        details:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Struct'
          title: details
          description: Optional structured detail (depends on action)
      title: RoomChangeContent
      additionalProperties: false
    chat.v1.RoomEvent:
      type: object
      properties:
        id:
          type: string
          title: id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
          description: |-
            NOTE:
             Event IDs are XIDs and MUST be lexicographically sortable by creation time.
             Clients MUST NOT assume any other ordering mechanism. client-supplied or server-generated UUID
        roomId:
          type: string
          title: room_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
          description: room_id
        subscriptionId:
          type: string
          title: subscription_id
          description: profile_id or service/bot id
        type:
          allOf:
            - $ref: '#/components/schemas/chat.v1.RoomEventType'
          title: type
        sentAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: sent_at
        edited:
          type: boolean
          title: edited
        redacted:
          type: boolean
          title: redacted
        parentId:
          type:
            - string
            - "null"
          title: parent_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
          description: if this message is a followup event on an original message
        payload:
          allOf:
            - $ref: '#/components/schemas/chat.v1.Payload'
          title: payload
      title: RoomEvent
      additionalProperties: false
      description: Unified message (user / bot / system / signalling)
    chat.v1.RoomEventType:
      type: string
      title: RoomEventType
      enum:
        - ROOM_EVENT_TYPE_UNSPECIFIED
        - ROOM_EVENT_TYPE_SYSTEM
        - ROOM_EVENT_TYPE_EVENT
        - ROOM_EVENT_TYPE_MESSAGE
        - ROOM_EVENT_TYPE_REACTION
        - ROOM_EVENT_TYPE_TYPING
        - ROOM_EVENT_TYPE_DELIVERED
        - ROOM_EVENT_TYPE_READ
        - ROOM_EVENT_TYPE_MOTION
        - ROOM_EVENT_TYPE_CALL
        - ROOM_EVENT_TYPE_ADVERT
        - ROOM_EVENT_TYPE_FORM_REQUEST
        - ROOM_EVENT_TYPE_FORM_SUBMISSION_RESULT
      description: Allowed message types. Extendable via new enum values; clients must ignore unknown values.
    chat.v1.StawiCallOutcomeContent:
      type: object
      properties:
        callId:
          type: string
          title: call_id
          maxLength: 64
        genesisId:
          type: string
          title: genesis_id
          maxLength: 64
        state:
          allOf:
            - $ref: '#/components/schemas/chat.v1.StawiCallOutcomeState'
          title: state
          description: |
            enum.defined_only = true
        reason:
          type: string
          title: reason
          maxLength: 1024
          description: Why a FAILED outcome failed.
        sourceEventId:
          type: string
          title: source_event_id
          maxLength: 40
          description: The chat event that carried the act, when the act came through chat.
        kind:
          type: string
          title: kind
          maxLength: 64
          description: The call kind, or the chain event an OBSERVED outcome reports.
        chainId:
          type: string
          title: chain_id
          format: int64
          description: Where an OBSERVED outcome was seen on chain.
        txHash:
          type: string
          title: tx_hash
          maxLength: 32
          format: byte
        blockNumber:
          type: string
          title: block_number
          format: int64
        logIndex:
          type: string
          title: log_index
          format: int64
      title: StawiCallOutcomeContent
      additionalProperties: false
      description: |-
        StawiCallOutcomeContent is server-generated: what became of a conversion,
         a genesis signature or a signed call. Clients cannot send it.
    chat.v1.StawiCallOutcomeState:
      type: string
      title: StawiCallOutcomeState
      enum:
        - STAWI_CALL_OUTCOME_STATE_UNSPECIFIED
        - STAWI_CALL_OUTCOME_STATE_ACCEPTED
        - STAWI_CALL_OUTCOME_STATE_FAILED
        - STAWI_CALL_OUTCOME_STATE_OBSERVED
    chat.v1.StawiGenesis:
      type: object
      properties:
        genesisId:
          type: string
          title: genesis_id
          maxLength: 64
        genesisHash:
          type: string
          title: genesis_hash
          maxLength: 32
          format: byte
          description: The digest each founder's device signs (account-wrapped by the app).
        constitutionHash:
          type: string
          title: constitution_hash
          maxLength: 32
          format: byte
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: expires_at
        founderProfileIds:
          type: array
          items:
            type: string
          title: founder_profile_ids
          maxItems: 64
      title: StawiGenesis
      additionalProperties: false
      description: StawiGenesis is a prepared room genesis awaiting founder signatures.
    chat.v1.StawiGenesisSignatureContent:
      type: object
      properties:
        genesisId:
          type: string
          title: genesis_id
          maxLength: 64
          minLength: 1
        signature:
          type: string
          title: signature
          maxLength: 132
          minLength: 64
          format: byte
          description: |-
            The device signature over the founder's signing digest: secp256k1
             (65 bytes) or P-256 (x ‖ y ‖ r ‖ s) for WebAuthn.
        signerKeyId:
          type: string
          title: signer_key_id
          maxLength: 128
          minLength: 1
          description: The device key that produced the signature.
        algorithm:
          type: string
          title: algorithm
          enum:
            - secp256k1
            - p256-webauthn
          description: '"secp256k1" or "p256-webauthn".'
        webauthnAuthenticatorData:
          type: string
          title: webauthn_authenticator_data
          maxLength: 4096
          format: byte
          description: WebAuthn assertion material; empty for secp256k1.
        webauthnClientDataJson:
          type: string
          title: webauthn_client_data_json
          maxLength: 4096
          format: byte
      title: StawiGenesisSignatureContent
      additionalProperties: false
      description: |-
        StawiGenesisSignatureContent is a founder's signature over a prepared
         genesis. Chat checks the sender is one of the genesis founders and hands
         the signature to settlement; at founding quorum settlement creates the
         room on chain.
    chat.v1.StawiJoinPolicy:
      type: string
      title: StawiJoinPolicy
      enum:
        - STAWI_JOIN_POLICY_UNSPECIFIED
        - STAWI_JOIN_POLICY_PRIVATE
        - STAWI_JOIN_POLICY_PUBLIC
      description: StawiJoinPolicy is how someone may enter a Stawi room once it is on chain.
    chat.v1.StawiRoomConversionContent:
      type: object
      properties:
        templateId:
          type: string
          title: template_id
          maxLength: 64
          minLength: 1
          description: Constitution template the rules are applied to.
        ruleValues:
          type: object
          title: rule_values
          maxProperties: 64
          additionalProperties:
            type: string
            title: value
            maxLength: 256
          description: |-
            Rule values for the template, keyed by rule name. Values are strings
             (decimal numbers, durations, enum names); settlement parses and checks
             them against the template when it compiles the constitution.
        founderSubscriptionIds:
          type: array
          items:
            type: string
            maxLength: 40
            minLength: 3
            pattern: ^[0-9a-z_-]{3,40}$
          title: founder_subscription_ids
          maxItems: 64
          minItems: 1
          uniqueItems: true
          description: |-
            Subscriptions of this room whose holders found the Stawi room. Each must
             be an active subscription of the room.
        joinPolicy:
          allOf:
            - $ref: '#/components/schemas/chat.v1.StawiJoinPolicy'
          not:
            enum:
              - STAWI_JOIN_POLICY_UNSPECIFIED
          title: join_policy
          description: |
            enum.defined_only = true
        genesis:
          allOf:
            - $ref: '#/components/schemas/chat.v1.StawiGenesis'
          title: genesis
          description: |-
            Output only: the genesis settlement prepared. Set by the server on the
             stored event; a client that sets it is refused.
      title: StawiRoomConversionContent
      additionalProperties: false
      description: |-
        StawiRoomConversionContent asks for this room to become a Stawi room: the
         chain creates custody for the room under the room's own id once the
         founders have signed the genesis. Chat relays the request to settlement,
         which compiles the constitution and prepares the genesis; chat then fills
         in `genesis` on the stored event, so the event itself is the genesis card.
    chat.v1.StawiSignedCallContent:
      type: object
      properties:
        callId:
          type: string
          title: call_id
          maxLength: 64
          minLength: 1
          description: The call id settlement returned when the call was prepared.
        kind:
          type: string
          title: kind
          maxLength: 64
          minLength: 1
          description: The call kind, as settlement names it (e.g. "INVITE", "CAST_VOTE").
        signature:
          type: string
          title: signature
          maxLength: 132
          minLength: 64
          format: byte
          description: |-
            The device signature over the call's digest: secp256k1 (65 bytes) or
             P-256 (x ‖ y ‖ r ‖ s) for WebAuthn.
        signerKeyId:
          type: string
          title: signer_key_id
          maxLength: 128
          minLength: 1
          description: The device key that produced the signature.
        summary:
          type: string
          title: summary
          maxLength: 512
          description: Human-readable description of the act, for display.
        algorithm:
          type: string
          title: algorithm
          enum:
            - secp256k1
            - p256-webauthn
          description: '"secp256k1" or "p256-webauthn".'
        webauthnAuthenticatorData:
          type: string
          title: webauthn_authenticator_data
          maxLength: 4096
          format: byte
          description: WebAuthn assertion material; empty for secp256k1.
        webauthnClientDataJson:
          type: string
          title: webauthn_client_data_json
          maxLength: 4096
          format: byte
      title: StawiSignedCallContent
      additionalProperties: false
      description: |-
        StawiSignedCallContent carries a room governance call (invite, accept,
         join, admit, leave, suspend, roles, propose, vote, delegate, freeze) that
         the app prepared through settlement and signed with the device key. Chat
         checks the sender's subscription is the call's signer and relays it; the
         room changes only when the chain reports the call.
    chat.v1.StreamHello:
      type: object
      properties:
        resumeToken:
          type: string
          title: resume_token
        capabilities:
          type: object
          title: capabilities
          additionalProperties:
            type: string
            title: value
        clientTime:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: client_time
      title: StreamHello
      additionalProperties: false
      description: |-
        StreamHello message sent by client to server to initiate a connection.
         resume_token: server-supplied resume_token from previous session.
         capabilities: list of capabilities supported by the client.
         StreamHello MUST be the first message sent by the client.
         Servers MUST reject any other message types before StreamHello.
    chat.v1.StreamRequest:
      type: object
      anyOf:
        - type: object
          properties:
            command:
              allOf:
                - $ref: '#/components/schemas/chat.v1.ClientCommand'
              title: command
          title: command
        - type: object
          properties:
            hello:
              allOf:
                - $ref: '#/components/schemas/chat.v1.StreamHello'
              title: hello
          title: hello
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - command
              - required:
                  - hello
          - not:
              oneOf:
                - required:
                    - command
                - required:
                    - hello
      title: StreamRequest
      description: Client message over Connect stream. After initial connect frame, client sends acks/commands.
    chat.v1.StreamResponse:
      type: object
      anyOf:
        - type: object
          properties:
            error:
              allOf:
                - $ref: '#/components/schemas/common.v1.ErrorDetail'
              title: error
              description: |-
                error:
                 - If present, represents a server-side error related to the stream or event.
                 - MAY be recoverable (client should continue stream) or fatal.
                 - Fatal errors MUST be followed by stream termination.
          title: error
        - type: object
          properties:
            message:
              allOf:
                - $ref: '#/components/schemas/chat.v1.RoomEvent'
              title: message
          title: message
        - type: object
          properties:
            presenceEvent:
              allOf:
                - $ref: '#/components/schemas/chat.v1.PresenceEvent'
              title: presence_event
              description: user presence change affecting the room
          title: presence_event
        - type: object
          properties:
            readEvent:
              allOf:
                - $ref: '#/components/schemas/chat.v1.ReadMarker'
              title: read_event
          title: read_event
        - type: object
          properties:
            receiptEvent:
              allOf:
                - $ref: '#/components/schemas/chat.v1.ReceiptEvent'
              title: receipt_event
          title: receipt_event
        - type: object
          properties:
            typingEvent:
              allOf:
                - $ref: '#/components/schemas/chat.v1.TypingEvent'
              title: typing_event
          title: typing_event
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - error
              - required:
                  - message
              - required:
                  - presenceEvent
              - required:
                  - readEvent
              - required:
                  - receiptEvent
              - required:
                  - typingEvent
          - not:
              oneOf:
                - required:
                    - error
                - required:
                    - message
                - required:
                    - presenceEvent
                - required:
                    - readEvent
                - required:
                    - receiptEvent
                - required:
                    - typingEvent
      properties:
        id:
          type: string
          title: id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
          description: |-
            NOTE:
             Stream IDs are XIDs and MUST be lexicographically sortable by creation time.
             Clients MUST NOT assume any other ordering mechanism.
        timestamp:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: timestamp
      title: StreamResponse
      description: |-
        Server -> Client event payload. All events in a room are delivered over Connect stream.
         event_id: globally unique id (opaque string) assigned by server, strictly monotonically increasing per room.
         sequence: strictly increasing 64-bit integer per-room sequence number (useful for resume & ordering).
    chat.v1.TextAnnotation:
      type: object
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/chat.v1.TextAnnotation.Type'
          title: type
        offset:
          type: integer
          title: offset
          format: int32
          description: UTF-16 offset & length for cross-platform compatibility
        length:
          type: integer
          title: length
          format: int32
        value:
          type: string
          title: value
          description: Target identifier (e.g., profile_id, room_id, URL)
      title: TextAnnotation
      additionalProperties: false
    chat.v1.TextAnnotation.Type:
      type: string
      title: Type
      enum:
        - TYPE_UNSPECIFIED
        - TYPE_MENTION_USER
        - TYPE_MENTION_ROOM
        - TYPE_LINK
        - TYPE_EMOJI
        - TYPE_HASHTAG
    chat.v1.TextContent:
      type: object
      properties:
        body:
          type: string
          title: body
          maxLength: 10000
          minLength: 1
          description: Required human-readable message body
        format:
          type: string
          title: format
          maxLength: 32
          minLength: 1
          description: |-
            Content format identifier (NOT MIME type)
             Examples: "plain", "markdown", "html-lite"
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.TextAnnotation'
          title: annotations
          description: Structured annotations for clients (mentions, links, emojis)
        lang:
          type:
            - string
            - "null"
          title: lang
          description: Optional language hint (BCP-47), e.g. "en", "fr-CA"
      title: TextContent
      additionalProperties: false
    chat.v1.TypingEvent:
      type: object
      properties:
        roomId:
          type: string
          title: room_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
        subscriptionId:
          type: string
          title: subscription_id
        typing:
          type: boolean
          title: typing
        since:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: since
      title: TypingEvent
      additionalProperties: false
      description: Typing indicator
    chat.v1.VoteCast:
      type: object
      properties:
        motionId:
          type: string
          title: motion_id
        choiceId:
          type: string
          title: choice_id
          description: Selected choice
      title: VoteCast
      additionalProperties: false
      description: |-
        total_votes_cast = sum(choice counts excluding invalid if configured)
            remaining_votes  = eligible_votes - total_votes_cast
            dead_votes       = tally(choice_id == "invalid")
            target_votes     = derived from PassingRule
            passed           = tally(passing_choice_id) >= target_votes
    chat.v1.VoteChoice:
      type: object
      properties:
        id:
          type: string
          title: id
        name:
          type: string
          title: name
        description:
          type:
            - string
            - "null"
          title: description
      title: VoteChoice
      additionalProperties: false
    chat.v1.VoteTally:
      type: object
      properties:
        choiceId:
          type: string
          title: choice_id
        count:
          type: integer
          title: count
      title: VoteTally
      additionalProperties: false
    common.v1.ContactLink:
      type: object
      properties:
        profileName:
          type: string
          title: profile_name
          maxLength: 250
          minLength: 3
          pattern: '[0-9a-z_-]{3,250}'
          description: Display name of the profile
        profileType:
          type: string
          title: profile_type
          maxLength: 250
          minLength: 3
          pattern: '[0-9a-z_-]{3,250}'
          description: Type of profile (e.g., "user", "organization", "service")
        profileId:
          type: string
          title: profile_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
          description: Unique identifier of the profile
        profileImageId:
          type: string
          title: profile_image_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
          description: Identifier of the profile's image/avatar
        contactId:
          type: string
          title: contact_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
          description: Unique identifier of the contact
        detail:
          type: string
          title: detail
          maxLength: 250
          minLength: 3
          pattern: '[0-9a-z_-]{3,250}'
          description: Additional contact details (e.g., email, phone, handle)
        extras:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Struct'
          title: extras
          description: Extended metadata for the contact link
      title: ContactLink
      additionalProperties: false
      description: |-
        ContactLink represents a link between a contact and a profile in the system.
         Used for associating external contacts with internal profiles across services.
         This enables unified identity management and contact resolution.
    common.v1.ErrorDetail:
      type: object
      properties:
        code:
          type: integer
          title: code
          format: int32
          description: application code (see doc)
        message:
          type: string
          title: message
          description: human readable
        meta:
          type: object
          title: meta
          additionalProperties:
            type: string
            title: value
          description: additional machine-readable data
      title: ErrorDetail
      additionalProperties: false
      description: |-
        Standard error codes used by API responses.
         Use gRPC status codes; the application-level ErrorDetail below may carry more.
    connect-protocol-version:
      type: number
      examples:
        - 1
      title: Connect-Protocol-Version
      description: Define the version of the Connect protocol
      const: 1
    connect-timeout-header:
      type: number
      examples:
        - 1000
      title: Connect-Timeout-Ms
      description: Define the timeout, in ms
    connect.error:
      type: object
      properties:
        code:
          type: string
          examples:
            - not_found
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
        message:
          type: string
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
        details:
          type: array
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          description: A list of messages that carry the error details. There is no limit on the number of messages.
      title: Connect Error
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
    connect.error_details.Any:
      type: object
      properties:
        type:
          type: string
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`.'
        value:
          type: string
          format: byte
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
        debug:
          type: object
          title: Debug
          additionalProperties: true
          description: Deserialized error detail payload. The 'type' field indicates the schema. This field is for easier debugging and should not be relied upon for application logic.
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
    google.protobuf.ListValue:
      type: array
      items:
        $ref: '#/components/schemas/google.protobuf.Value'
      description: A JSON array whose elements may be any JSON value.
    google.protobuf.NullValue:
      type: string
      title: NullValue
      enum:
        - NULL_VALUE
      description: |-
        `NullValue` is a singleton enumeration to represent the null value for the
         `Value` type union.

         The JSON representation for `NullValue` is JSON `null`.
    google.protobuf.Struct:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/google.protobuf.Value'
      description: A JSON object whose property values may be any JSON value.
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    google.protobuf.Value:
      oneOf:
        - type: "null"
        - type: number
        - type: string
        - type: boolean
        - type: array
        - type: object
          additionalProperties: true
      description: 'Any JSON value: `null`, number, string, boolean, array, or object.'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security: []
tags:
  - name: chat.v1.GatewayService
