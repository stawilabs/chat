          title: required
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - maxItems
              - required:
                  - maxLength
              - required:
                  - maxValue
              - required:
                  - minItems
              - required:
                  - minLength
              - required:
                  - minValue
              - required:
                  - pattern
              - required:
                  - required
          - not:
              oneOf:
                - required:
                    - maxItems
                - required:
                    - maxLength
                - required:
                    - maxValue
                - required:
                    - minItems
                - required:
                    - minLength
                - required:
                    - minValue
                - required:
                    - pattern
                - required:
                    - required
      properties:
        code:
          type: string
          title: code
        message:
          type: string
          title: message
      title: FormValidationRule
    chat.v1.ModerationContent:
      type: object
      properties:
        body:
          type: string
          title: body
          maxLength: 10000
          minLength: 1
          description: |-
            Human-readable message body describing the action.
             Intended for display to end users.
        actorSubscriptionId:
          type: string
          title: actor_subscription_id
          maxLength: 32
          minLength: 1
          description: Subscription ID of the actor who initiated the action.
        targetSubscriptionIds:
          type: array
          items:
            type: string
            maxLength: 40
            minLength: 3
            pattern: '[0-9a-z_-]{3,40}'
          title: target_subscription_ids
          uniqueItems: true
          description: |-
            Subscription IDs of entities targeted by the action.
             Must not contain duplicates and must not include the actor.
        metadata:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Struct'
          title: metadata
          description: |-
            Optional structured metadata associated with the action.
             Use only for non-indexed, auxiliary data.
        language:
          type:
            - string
            - "null"
          title: language
          pattern: ^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,8})*$
          description: Optional language tag for the body, using BCP-47 (e.g. "en", "fr-CA").
      title: ModerationContent
      additionalProperties: false
    chat.v1.MotionContent:
      type: object
      properties:
        id:
          type: string
          title: id
        title:
          type: string
          title: title
          description: Human-readable description
        description:
          type: string
          title: description
        eligibleRoles:
          type: array
          items:
            type: string
          title: eligible_roles
          description: Roles allowed to vote; eligible_votes is derived
        eligibleVotes:
          type:
            - integer
            - "null"
          title: eligible_votes
          description: Snapshot of eligible voters at creation time (optional, cached)
        passingRule:
          allOf:
            - $ref: '#/components/schemas/chat.v1.PassingRule'
          title: passing_rule
          description: |-
            Number of votes required to pass
             Can represent absolute count or percentage thresholds
             Passing rule
        choices:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.VoteChoice'
          title: choices
          description: Available choices (YES / NO / ABSTAIN, etc)
        closesAt:
          type:
            - string
            - "null"
          title: closes_at
          format: int64
          description: Optional deadline (unix seconds)
      title: MotionContent
      additionalProperties: false
    chat.v1.MotionTally:
      type: object
      properties:
        motionId:
          type: string
          title: motion_id
        eligibleVotes:
          type: integer
          title: eligible_votes
          description: Total eligible voters
        tallies:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.VoteTally'
          title: tallies
          description: Votes per choice
        totalVotesCast:
          type: integer
          title: total_votes_cast
          description: Derived counts
        deadVotes:
          type: integer
          title: dead_votes
          description: Dead votes (invalid, expired, disqualified)
        targetVotes:
          type: integer
          title: target_votes
          description: Passing evaluation
        passed:
          type: boolean
          title: passed
        closed:
          type: boolean
          title: closed
      title: MotionTally
      additionalProperties: false
    chat.v1.PassingRule:
      type: object
      anyOf:
        - type: object
          properties:
            absolute:
              type: integer
              title: absolute
              description: Absolute number of votes required
          title: absolute
        - type: object
          properties:
            percentage:
              type: integer
              title: percentage
              description: Percentage required to pass (0–100)
          title: percentage
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - absolute
              - required:
                  - percentage
          - not:
              oneOf:
                - required:
                    - absolute
                - required:
                    - percentage
      properties:
        passingChoiceId:
          type: string
          title: passing_choice_id
          description: Which choice constitutes "passing" (usually YES)
      title: PassingRule
