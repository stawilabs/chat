openapi: 3.1.0
info:
  title: Chat Service
  description: The Chat Service provides endpoints for real-time, secure messaging between users and devices. It supports sending, receiving, and synchronizing messages across rooms, direct chats, and group conversations, with optional end-to-end encryption. The service is designed for mobile, desktop, and web clients, supporting both streaming and standard request-response operations. APIs are consistent, well-structured, and optimized for low-latency delivery, even on limited network connections.
  contact:
    name: Stawi Labs
    url: https://github.com/stawilabs/chat
    email: info@stawi.org
  license:
    name: Apache License
    url: https://github.com/antinvestor/apis/blob/master/LICENSE
  version: v1.0.0
x-service-namespace: service_chat
x-service-permissions:
  - event_view
  - event_send
  - room_view
  - room_create
  - room_update
  - room_delete
  - subscription_view
  - subscription_manage
  - proposal_view
  - proposal_manage
paths:
  /chat.v1.GatewayService/Stream: {}
components:
  schemas:
    chat.v1.AckEvent:
      type: object
      properties:
        roomId:
          type: string
          title: room_id
          maxLength: 40
          minLength: 3
          pattern: '[0-9a-z_-]{3,40}'
        eventId:
          type: array
          items:
            type: string
            maxLength: 40
            minLength: 3
            pattern: '[0-9a-z_-]{3,40}'
          title: event_id
          minItems: 1
        subscriptionId:
          type: string
          title: subscription_id
        ackAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: ack_at
        error:
          oneOf:
            - $ref: '#/components/schemas/common.v1.ErrorDetail'
            - type: "null"
          title: error
          description: if set, indicates failure reason for this event
      title: AckEvent
      additionalProperties: false
      description: |-
        Acknowledgement for event(s) received; server uses it to free ephemeral delivery buffers.
         ack_event_id: last event_id client processed (inclusive).
         If error is set, indicates the event failed to send/process correctly.
    chat.v1.AttachmentContent:
      type: object
      properties:
        attachmentId:
          type: string
          title: attachment_id
          description: Logical identifier of the attachment
        filename:
          type: string
          title: filename
          description: Original filename (optional, user-facing)
        mimeType:
          type: string
          title: mime_type
          description: MIME type (e.g. image/png, application/pdf)
        sizeBytes:
          type: string
          title: size_bytes
          format: int64
          description: Size in bytes (for quota enforcement & UX)
        uri:
          type: string
          title: uri
          description: Content location (signed URL or opaque locator)
        previews:
          type: array
          items:
            $ref: '#/components/schemas/chat.v1.AttachmentPreview'
          title: previews
          description: Optional previews / thumbnails
        caption:
          oneOf:
            - $ref: '#/components/schemas/chat.v1.TextContent'
            - type: "null"
          title: caption
          description: Optional caption text
        encrypted:
          type: boolean
          title: encrypted
          description: Indicates whether attachment is end-to-end encrypted
        checksum:
          type:
            - string
            - "null"
          title: checksum
          description: Optional content hash (e.g. sha256:base64)
      title: AttachmentContent
      additionalProperties: false
    chat.v1.AttachmentPreview:
      type: object
      properties:
        mimeType:
          type: string
          title: mime_type
        width:
          type: integer
          title: width
          format: int32
        height:
          type: integer
          title: height
          format: int32
        uri:
          type: string
          title: uri
        sizeBytes:
          type: string
          title: size_bytes
          format: int64
      title: AttachmentPreview
      additionalProperties: false
    chat.v1.CallContent:
      type: object
      properties:
        callId:
          type: string
          title: call_id
        type:
          allOf:
            - $ref: '#/components/schemas/chat.v1.CallContent.CallType'
          title: type
        action:
          allOf:
            - $ref: '#/components/schemas/chat.v1.CallContent.CallAction'
          title: action
          description: |-
            OFFER, ANSWER → sdp required
             ICE_CANDIDATE → ice_candidate required
             END → no payload required
        sdp:
          type:
            - string
            - "null"
          title: sdp
          description: WebRTC payload (SDP or ICE candidate)
        iceCandidate:
          type:
            - string
            - "null"
          title: ice_candidate
          description: Optional ICE candidate (when action = ICE_CANDIDATE)
        metadata:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Struct'
          title: metadata
          description: Optional metadata (bitrate, codecs, device hints)
      title: CallContent
      additionalProperties: false
    chat.v1.CallContent.CallAction:
      type: string
      title: CallAction
      enum:
        - CALL_ACTION_UNSPECIFIED
        - CALL_ACTION_OFFER
        - CALL_ACTION_ANSWER
        - CALL_ACTION_ICE_CANDIDATE
        - CALL_ACTION_END
    chat.v1.CallContent.CallType:
      type: string
      title: CallType
      enum:
        - CALL_TYPE_UNSPECIFIED
        - CALL_TYPE_AUDIO
        - CALL_TYPE_VIDEO
        - CALL_TYPE_SCREEN_SHARE
    chat.v1.ClientCommand:
      type: object
      anyOf:
        - type: object
          properties:
            ack:
              allOf:
                - $ref: '#/components/schemas/chat.v1.AckEvent'
              title: ack
          title: ack
        - type: object
          properties:
            event:
              allOf:
                - $ref: '#/components/schemas/chat.v1.RoomEvent'
              title: event
          title: event
        - type: object
          properties:
            presence:
              allOf:
                - $ref: '#/components/schemas/chat.v1.PresenceEvent'
              title: presence
              description: send a presence message to a room
          title: presence
        - type: object
          properties:
            readMarker:
              allOf:
                - $ref: '#/components/schemas/chat.v1.ReadMarker'
              title: read_marker
          title: read_marker
        - type: object
          properties:
            receipt:
              allOf:
                - $ref: '#/components/schemas/chat.v1.ReceiptEvent'
              title: receipt
              description: receipt acknowledgement for message delivery
          title: receipt
        - type: object
          properties:
            typing:
              allOf:
                - $ref: '#/components/schemas/chat.v1.TypingEvent'
              title: typing
          title: typing
      unevaluatedProperties: false
      not:
        allOf:
          - anyOf:
              - required:
                  - ack
              - required:
                  - event
              - required:
                  - presence
              - required:
                  - readMarker
              - required:
                  - receipt
              - required:
                  - typing
          - not:
              oneOf:
                - required:
                    - ack
                - required:
                    - event
                - required:
                    - presence
                - required:
                    - readMarker
                - required:
                    - receipt
                - required:
                    - typing
      title: ClientCommand
      description: |-
        ClientCommand represents durable state changes initiated by the client.
         Commands are validated, persisted, and broadcast as needed.
         ClientCommand results in at least one RoomEvent being emitted.
    chat.v1.EncryptedContent:
      type: object
      properties:
        algorithm:
          type: string
          title: algorithm
          description: |-
            Encryption scheme identifier
             Examples: "olm.v2", "megolm.v1", "x25519-aesgcm"
        ciphertext:
          type: string
          title: ciphertext
          format: byte
          description: Base64 or binary-safe encoded ciphertext
        nonce:
          type:
            - string
            - "null"
          title: nonce
          format: byte
          description: Optional per-message nonce / IV
        senderKeyId:
          type:
            - string
            - "null"
          title: sender_key_id
          description: Optional sender key identifier
        recipientKeyIds:
          type: array
          items:
            type: string
          title: recipient_key_ids
          description: Optional recipient key references (for fan-out)
        aad:
          type:
            - string
            - "null"
          title: aad
          format: byte
          description: Additional authenticated data (AAD)
        sessionId:
          type:
            - string
            - "null"
          title: session_id
          description: Optional key agreement context identifier
      title: EncryptedContent
      additionalProperties: false
    chat.v1.FinanceCardContent:
      type: object
      properties:
        cardId:
          type: string
          title: card_id
          maxLength: 64
          minLength: 1
          description: |-
            Identifier of the finance fact this card renders. Stable across
             re-renders so a client can de-duplicate.
        groupId:
          type: string
          title: group_id
          maxLength: 64
          minLength: 1
          description: |-
            Finance group the card belongs to; matches the room's
             `stawi.group_id` metadata.
        kind:
          type: string
          title: kind
          maxLength: 64
          minLength: 1
          description: Card kind, e.g. "PROPOSAL", "MOTION_TALLY", "CONTRIBUTION".
        title:
          type: string
          title: title
          maxLength: 200
          minLength: 1
          description: Human-readable heading.
        body:
          type: string
          title: body
          maxLength: 4000
          description: Human-readable body.
        data:
          type: object
          title: data
          maxProperties: 32
          additionalProperties:
            type: string
            title: value
            maxLength: 512
          description: Display-only values for the renderer (identifiers, amounts, labels).
      title: FinanceCardContent
      additionalProperties: false
      description: |-
        FinanceCardContent is a finance fact rendered into a room. It is display
         only: chat never carries authorization, so a card carries no token,
         signature, capability or approval. Any action a card offers is completed by
         the client as a device-signed command to the finance service, never by
         replying in chat.
