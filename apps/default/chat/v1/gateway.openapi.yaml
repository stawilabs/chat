        - PAYLOAD_TYPE_FINANCE_CARD
        - PAYLOAD_TYPE_STAWI_ROOM_CONVERSION
        - PAYLOAD_TYPE_STAWI_GENESIS_SIGNATURE
        - PAYLOAD_TYPE_STAWI_SIGNED_CALL
        - PAYLOAD_TYPE_STAWI_CALL_OUTCOME
