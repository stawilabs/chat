name: Release
on:
  push:
    # Backend service images only. Flutter app releases use v0.*.* (see production.yml).
    tags: ["v1.*.*"]
jobs:
  docker:
    permissions:
      contents: read
      packages: write
    uses: antinvestor/common/.github/workflows/docker-release.yml@main
  buf-push:
    permissions:
      contents: read
    uses: antinvestor/common/.github/workflows/buf-push.yaml@main
    secrets:
      buf_token: ${{ secrets.BUF_TOKEN }}
