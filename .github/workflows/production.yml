# Production Release - Triggered on version tags (v*)
# Full validation before release builds
name: Deploy to Production

on:
  push:
    # Flutter mobile releases only. Backend docker releases use v1.*.* (see release.yaml).
    tags:
      - 'v0.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # Extract version from tag
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  # Quick validation before expensive builds
  validate:
    name: Validate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup

      - name: Run tests and analysis
        working-directory: ui
        run: |
          flutter analyze --no-fatal-infos
          flutter test
          dart format --set-exit-if-changed .

  # Build all platforms
  build:
    name: Build
    needs: [prepare, validate]
    uses: ./.github/workflows/build.yml
    with:
      environment: production
      build_type: release
      version: ${{ needs.prepare.outputs.version }}
      build_android: true
      build_ios: false
      build_web: false
      build_desktop: false
      google_server_client_id: 265397001887-hjrrjml6ekekmrjlg4ku4bsgtobgid85.apps.googleusercontent.com
    secrets:
      ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      IOS_GOOGLE_SERVICES_PLIST: ${{ secrets.IOS_GOOGLE_SERVICES_PLIST }}

  # Create GitHub Release
  create-release:
    name: GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always() && !cancelled()

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log $PREV_TAG..${{ needs.prepare.outputs.tag }} --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log -20 --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "$CHANGELOG" > /tmp/changelog.txt

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
        continue-on-error: true

      - name: List available artifacts
        run: |
          echo "Available artifacts:"
          ls -la artifacts/ 2>/dev/null || echo "No artifacts directory"
          find artifacts -type f 2>/dev/null || echo "No files found"

      - name: Prepare release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release-assets

          if [ -f "artifacts/android-apk-production/app-release.apk" ]; then
            cp artifacts/android-apk-production/app-release.apk release-assets/chat-${VERSION}-android.apk
          fi

          if [ -f "artifacts/android-aab-production/app-release.aab" ]; then
            cp artifacts/android-aab-production/app-release.aab release-assets/chat-${VERSION}-android.aab
          fi

          if [ -f "artifacts/ios-ipa-production/Runner.ipa" ]; then
            cp artifacts/ios-ipa-production/Runner.ipa release-assets/chat-${VERSION}-ios.ipa
          fi

          if [ -d "artifacts/web-build-production" ]; then
            (cd artifacts/web-build-production && zip -r ../../release-assets/chat-${VERSION}-web.zip .)
          fi

          if [ -f "artifacts/linux-bundle-production/linux-bundle.tar.gz" ]; then
            cp artifacts/linux-bundle-production/linux-bundle.tar.gz release-assets/chat-${VERSION}-linux-x64.tar.gz
          fi

          if [ -f "artifacts/macos-app-production/macos-app.zip" ]; then
            cp artifacts/macos-app-production/macos-app.zip release-assets/chat-${VERSION}-macos.zip
          fi

          find release-assets -maxdepth 1 -type f -print

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Chat App ${{ needs.prepare.outputs.tag }}
          body_path: /tmp/changelog.txt
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploy Web to Firebase Hosting
  deploy-web:
    name: Deploy Web
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: false
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download web build
        id: download
        uses: actions/download-artifact@v8
        with:
          name: web-build-production
          path: build/web
        continue-on-error: true

      - name: Check artifact exists
        if: steps.download.outcome == 'failure'
        run: |
          echo "::error::Web build artifact not found. Web build may have failed."
          exit 1

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

  # Deploy Android
  deploy-android:
    name: Deploy Android
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    timeout-minutes: 20
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download AAB
        id: download
        uses: actions/download-artifact@v8
        with:
          name: android-aab-production
          path: artifacts/
        continue-on-error: true

      - name: Check artifact exists
        if: steps.download.outcome == 'failure'
        run: |
          echo "::error::Android AAB artifact not found. Android build may have failed."
          exit 1

      - name: Create changelog
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p fastlane/metadata/android/en-US/changelogs
          echo "Version $VERSION" > fastlane/metadata/android/en-US/changelogs/default.txt

      - name: Promote internal build to Play production draft
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME || 'org.stawi.chat' }}
          PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          RELEASE_NOTES=$(cat fastlane/metadata/android/en-US/changelogs/default.txt)
          SERVICE_ACCOUNT_FILE=$(mktemp)
          PRIVATE_KEY_FILE=$(mktemp)
          trap 'rm -f "$SERVICE_ACCOUNT_FILE" "$PRIVATE_KEY_FILE"' EXIT

          printf '%s' "$PLAY_SERVICE_ACCOUNT" > "$SERVICE_ACCOUNT_FILE"
          CLIENT_EMAIL=$(jq -r '.client_email' "$SERVICE_ACCOUNT_FILE")
          jq -r '.private_key' "$SERVICE_ACCOUNT_FILE" > "$PRIVATE_KEY_FILE"

          b64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          NOW=$(date +%s)
          EXP=$((NOW + 3600))
          HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
          PAYLOAD=$(jq -nc \
            --arg iss "$CLIENT_EMAIL" \
            --arg scope "https://www.googleapis.com/auth/androidpublisher" \
            --arg aud "https://oauth2.googleapis.com/token" \
            --argjson iat "$NOW" \
            --argjson exp "$EXP" \
            '{iss:$iss,scope:$scope,aud:$aud,iat:$iat,exp:$exp}' | b64url)
          SIGNATURE=$(printf '%s.%s' "$HEADER" "$PAYLOAD" \
            | openssl dgst -sha256 -sign "$PRIVATE_KEY_FILE" -binary \
            | b64url)
          ASSERTION="$HEADER.$PAYLOAD.$SIGNATURE"

          ACCESS_TOKEN=$(curl -fsS -X POST "https://oauth2.googleapis.com/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer" \
            --data-urlencode "assertion=$ASSERTION" \
            | jq -r '.access_token')

          API_ROOT="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE_NAME"
          EDIT_ID=$(curl -fsS -X POST "$API_ROOT/edits" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' \
            | jq -r '.id')

          # Promote whatever is currently live on the internal track (staging
          # uploads there with a derived, strictly increasing versionCode; the
          # code is no longer pinned in pubspec.yaml).
          VERSION_CODE=$(curl -fsS "$API_ROOT/edits/$EDIT_ID/tracks/internal" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            | jq -r '[.releases[]? | select(.status == "completed") | .versionCodes[]? | tonumber] | max // empty')
          if [ -z "$VERSION_CODE" ]; then
            echo "::error::No completed release found on the Play internal track to promote."
            exit 1
          fi
          echo "Promoting internal versionCode $VERSION_CODE to production (draft)"

          TRACK_BODY=$(jq -nc \
            --arg name "$VERSION" \
            --arg code "$VERSION_CODE" \
            --arg notes "$RELEASE_NOTES" \
            '{releases:[{name:$name,versionCodes:[$code],status:"draft",releaseNotes:[{language:"en-US",text:$notes}]}]}')

          curl -fsS -X PUT "$API_ROOT/edits/$EDIT_ID/tracks/production" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$TRACK_BODY" > /dev/null

          curl -fsS -X POST "$API_ROOT/edits/$EDIT_ID:commit" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}' > /dev/null

  # Deploy iOS
  deploy-ios:
    name: Deploy iOS
    needs: [prepare, build]
    runs-on: macos-latest
    if: false
    timeout-minutes: 30
    environment:
      name: production

    steps:
      - name: Download IPA
        id: download
        uses: actions/download-artifact@v8
        with:
          name: ios-ipa-production
          path: artifacts/
        continue-on-error: true

      - name: Check artifact exists
        if: steps.download.outcome == 'failure'
        run: |
          echo "::error::iOS IPA artifact not found. iOS build may have failed."
          exit 1

      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: artifacts/Runner.ipa
          issuer-id: ${{ secrets.APPLE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}

  # Summary
  notify:
    name: Summary
    needs: [prepare, create-release, deploy-web, deploy-android, deploy-ios]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Create summary
        run: |
          echo "## Production Release: ${{ needs.prepare.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub Release | ${{ needs.create-release.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Web (Firebase Hosting) | ${{ needs.deploy-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android (Play Store) | ${{ needs.deploy-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS (App Store) | ${{ needs.deploy-ios.result }} |" >> $GITHUB_STEP_SUMMARY
