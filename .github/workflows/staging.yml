# Staging Deployment - Triggered on pushes to main
# Tests already passed in CI (PR phase), so just build and deploy
name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  # Build all platforms using reusable workflow
  # Release build required for Play Store (even internal track)
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      environment: staging
      build_type: release
      build_desktop: false
      oauth2_client_id: d6qbqdkpf2t52mcunf4g
    secrets:
      ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      IOS_GOOGLE_SERVICES_PLIST: ${{ secrets.IOS_GOOGLE_SERVICES_PLIST }}

  # Deploy Web to Firebase Hosting
  deploy-web:
    name: Deploy Web
    needs: build
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    timeout-minutes: 10
    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download web build
        id: download
        uses: actions/download-artifact@v8
        with:
          name: web-build-staging
          path: build/web
        continue-on-error: true

      - name: Check artifact exists
        if: steps.download.outcome == 'failure'
        run: |
          echo "::error::Web build artifact not found. Web build may have failed."
          exit 1

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

  # Deploy Android to Play Store (internal track for auto-updates)
  deploy-android:
    name: Deploy Android
    needs: build
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    timeout-minutes: 20
    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download AAB
        id: download
        uses: actions/download-artifact@v8
        with:
          name: android-aab-staging
          path: artifacts/
        continue-on-error: true

      - name: Check artifact exists
        if: steps.download.outcome == 'failure'
        run: |
          echo "::warning::Android AAB artifact not found. Android build may have failed."
          exit 0

      - name: Create changelog
        if: steps.download.outcome == 'success'
        run: |
          mkdir -p fastlane/metadata/android/en-US/changelogs
          cat > fastlane/metadata/android/en-US/changelogs/default.txt << EOF
          Staging Build
          Commit: ${{ github.sha }}
          Build: ${{ github.run_number }}
          EOF

      - name: Upload to Play Store (internal track)
        if: steps.download.outcome == 'success'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME || 'org.stawi.chat' }}
          releaseFiles: artifacts/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: fastlane/metadata/android/en-US/changelogs
        continue-on-error: true

  # Deploy iOS to Firebase App Distribution (no Play Store equivalent yet)
  deploy-ios:
    name: Deploy iOS
    needs: build
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    timeout-minutes: 15
    environment:
      name: staging

    steps:
      - name: Download IPA
        id: download
        uses: actions/download-artifact@v8
        with:
          name: ios-ipa-staging
          path: artifacts/
        continue-on-error: true

      - name: Check artifact exists
        if: steps.download.outcome == 'failure'
        run: |
          echo "::warning::iOS IPA artifact not found. iOS build may have failed."
          exit 0

      - name: Upload to Firebase App Distribution
        if: steps.download.outcome == 'success'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_IOS }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: internal-testers
          file: artifacts/Runner.ipa
          releaseNotes: |
            Staging Build
            Commit: ${{ github.sha }}
            Branch: main
            Build: ${{ github.run_number }}
        continue-on-error: true

  # Summary
  notify:
    name: Summary
    needs: [deploy-web, deploy-android, deploy-ios]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Create deployment summary
        run: |
          echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Web (Firebase Hosting) | ${{ needs.deploy-web.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android (Play Store internal) | ${{ needs.deploy-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS (Firebase App Distribution) | ${{ needs.deploy-ios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
