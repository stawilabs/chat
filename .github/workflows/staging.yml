# Staging Deployment - Triggered on pushes to main
# Tests already passed in CI (PR phase), so just build and deploy.
# Testing channel is the Play Store *internal* track: testers' devices
# auto-update whenever a new build lands on main.
name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  # Build Android only (release AAB). Web/iOS/desktop are not part of the
  # staging auto-update channel, so we skip them to keep CI lean.
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      environment: staging
      build_type: release
      build_android: true
      build_ios: false
      build_web: false
      build_desktop: false
      oauth2_client_id: d6qbqdkpf2t52mcunf4g
      google_server_client_id: 265397001887-hjrrjml6ekekmrjlg4ku4bsgtobgid85.apps.googleusercontent.com
    secrets:
      ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      IOS_GOOGLE_SERVICES_PLIST: ${{ secrets.IOS_GOOGLE_SERVICES_PLIST }}

  # Deploy Android to the Play Store internal track for auto-updates.
  # Fails loudly: a missing artifact, missing service account, or a rejected
  # upload all surface as a failed run instead of a misleading green tick.
  deploy-android:
    name: Deploy Android (Play internal)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Preflight - require Play service account
        env:
          PLAY_SA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PLAY_SA" ]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT secret is not configured."
            echo "::error::Add a Play Console service-account JSON with release access to enable internal-track uploads."
            exit 1
          fi

      - name: Download AAB
        uses: actions/download-artifact@v8
        with:
          name: android-aab-staging
          path: artifacts/

      - name: Create changelog
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p fastlane/metadata/android/en-US/changelogs
          cat > fastlane/metadata/android/en-US/changelogs/default.txt << EOF
          Staging build
          Commit: ${COMMIT_SHA}
          Build: ${RUN_NUMBER}
          EOF

      - name: Upload to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME || 'org.stawi.chat' }}
          releaseFiles: artifacts/app-release.aab
          track: internal
          status: completed
          whatsNewDirectory: fastlane/metadata/android/en-US/changelogs

  # Summary
  notify:
    name: Summary
    needs: [deploy-android]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Create deployment summary
        env:
          COMMIT_SHA: ${{ github.sha }}
          ANDROID_RESULT: ${{ needs.deploy-android.result }}
        run: |
          {
            echo "## Staging Deployment Summary"
            echo ""
            echo "| Platform | Status |"
            echo "|----------|--------|"
            echo "| Android (Play Store internal) | ${ANDROID_RESULT} |"
            echo ""
            echo "**Commit:** \`${COMMIT_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
