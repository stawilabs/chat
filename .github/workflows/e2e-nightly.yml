name: E2E Nightly Tests

on:
  # Nightly schedule disabled: the `patrol` E2E dependency is currently
  # commented out in ui/pubspec.yaml (PatrolServer Kotlin/Gradle compilation
  # error), so `patrol build` fails every run. Re-enable this cron once patrol
  # is restored and the test bundle builds green. Manual dispatch is kept so the
  # suite can be exercised on demand while that work is in progress.
  # schedule:
  #   # Run every night at 2 AM UTC
  #   - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - scenarios
          - performance

env:
  JAVA_VERSION: '17'

jobs:
  build-staging-apk:
    name: Build Staging APK
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ui
        run: flutter pub get

      - name: Setup Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        working-directory: ui
        run: |
          if printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d >/tmp/gs.json 2>/dev/null \
             && head -c1 /tmp/gs.json | grep -q '{'; then
            mv /tmp/gs.json android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Run code generation
        working-directory: ui
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build staging APK
        id: build
        working-directory: ui
        run: |
          flutter build apk \
            --debug \
            --dart-define=ENV=staging \
            --dart-define=E2E_GATEWAY_URL=${{ secrets.E2E_GATEWAY_URL }} \
            --dart-define=E2E_CHAT_URL=${{ secrets.E2E_CHAT_URL }} \
            --dart-define=E2E_PROFILE_URL=${{ secrets.E2E_PROFILE_URL }} \
            --dart-define=E2E_AUTH_URL=${{ secrets.E2E_AUTH_URL }} \
            --dart-define=E2E_OAUTH_CLIENT_ID=${{ secrets.E2E_OAUTH_CLIENT_ID }} \
            --dart-define=E2E_USER1_EMAIL=${{ secrets.E2E_USER1_EMAIL }} \
            --dart-define=E2E_USER1_PASSWORD=${{ secrets.E2E_USER1_PASSWORD }} \
            --dart-define=E2E_USER1_PROFILE_ID=${{ secrets.E2E_USER1_PROFILE_ID }} \
            --dart-define=E2E_USER2_EMAIL=${{ secrets.E2E_USER2_EMAIL }} \
            --dart-define=E2E_USER2_PASSWORD=${{ secrets.E2E_USER2_PASSWORD }} \
            --dart-define=E2E_USER2_PROFILE_ID=${{ secrets.E2E_USER2_PROFILE_ID }}
          echo "apk_path=ui/build/app/outputs/flutter-apk/app-debug.apk" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: staging-apk
          path: ui/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-test-apk:
    name: Build Test APK
    runs-on: ubuntu-latest
    outputs:
      test_apk_path: ${{ steps.build.outputs.test_apk_path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ui
        run: flutter pub get

      - name: Setup Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        working-directory: ui
        run: |
          if printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d >/tmp/gs.json 2>/dev/null \
             && head -c1 /tmp/gs.json | grep -q '{'; then
            mv /tmp/gs.json android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Install Patrol CLI
        working-directory: ui
        run: dart pub global activate patrol_cli

      - name: Build Patrol test APK
        id: build
        working-directory: ui
        run: |
          patrol build android \
            --target e2e_test \
            --dart-define=ENV=staging \
            --dart-define=E2E_GATEWAY_URL=${{ secrets.E2E_GATEWAY_URL }} \
            --dart-define=E2E_USER1_EMAIL=${{ secrets.E2E_USER1_EMAIL }} \
            --dart-define=E2E_USER1_PASSWORD=${{ secrets.E2E_USER1_PASSWORD }} \
            --dart-define=E2E_USER1_PROFILE_ID=${{ secrets.E2E_USER1_PROFILE_ID }} \
            --dart-define=E2E_USER2_EMAIL=${{ secrets.E2E_USER2_EMAIL }} \
            --dart-define=E2E_USER2_PASSWORD=${{ secrets.E2E_USER2_PASSWORD }} \
            --dart-define=E2E_USER2_PROFILE_ID=${{ secrets.E2E_USER2_PROFILE_ID }}
          echo "test_apk_path=ui/build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk" >> $GITHUB_OUTPUT

      - name: Upload Test APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: test-apk
          path: ui/build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7

  run-e2e-firebase:
    name: Run E2E on Firebase Test Lab
    needs: [build-staging-apk, build-test-apk]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download staging APK
        uses: actions/download-artifact@v8
        with:
          name: staging-apk
          path: ./apks

      - name: Download test APK
        uses: actions/download-artifact@v8
        with:
          name: test-apk
          path: ./apks

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Run E2E scenarios on Firebase Test Lab
        if: ${{ github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'scenarios' || github.event_name == 'schedule' }}
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app ./apks/app-debug.apk \
            --test ./apks/app-debug-androidTest.apk \
            --device model=Pixel6,version=33,locale=en,orientation=portrait \
            --timeout 30m \
            --results-bucket=${{ secrets.FIREBASE_RESULTS_BUCKET }} \
            --results-dir=e2e-scenarios-$(date +%Y%m%d-%H%M%S) \
            --environment-variables "test_suite=scenarios" \
            --num-flaky-test-attempts=2

      - name: Run E2E performance tests on Firebase Test Lab
        if: ${{ github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == 'performance' || github.event_name == 'schedule' }}
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --app ./apks/app-debug.apk \
            --test ./apks/app-debug-androidTest.apk \
            --device model=Pixel6,version=33,locale=en,orientation=portrait \
            --timeout 45m \
            --results-bucket=${{ secrets.FIREBASE_RESULTS_BUCKET }} \
            --results-dir=e2e-performance-$(date +%Y%m%d-%H%M%S) \
            --environment-variables "test_suite=performance" \
            --num-flaky-test-attempts=1

      - name: Download test results
        if: always()
        run: |
          mkdir -p test-results
          gsutil -m cp -r gs://${{ secrets.FIREBASE_RESULTS_BUCKET }}/e2e-*-$(date +%Y%m%d)* ./test-results/ || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 30

  cleanup-old-results:
    name: Cleanup Old Results
    needs: [run-e2e-firebase]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'schedule'
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Delete results older than 30 days
        run: |
          CUTOFF_DATE=$(date -d '30 days ago' +%Y%m%d)
          gsutil ls gs://${{ secrets.FIREBASE_RESULTS_BUCKET }}/ | while read DIR; do
            DIR_DATE=$(echo $DIR | grep -oP '\d{8}' | head -1)
            if [ -n "$DIR_DATE" ] && [ "$DIR_DATE" -lt "$CUTOFF_DATE" ]; then
              echo "Deleting old results: $DIR"
              gsutil -m rm -r "$DIR" || true
            fi
          done
