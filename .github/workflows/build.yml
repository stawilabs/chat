# Reusable build workflow for all platforms
# Called by staging.yml and production.yml
name: Build

on:
  workflow_call:
    inputs:
      environment:
        description: 'Build environment (staging or production)'
        required: true
        type: string
      build_type:
        description: 'Build type (debug or release)'
        required: true
        type: string
      version:
        description: 'Version string for the build'
        required: false
        type: string
        default: ''
      build_desktop:
        description: 'Build desktop platforms (Linux, Windows, macOS)'
        required: false
        type: boolean
        default: true
      build_android:
        description: 'Build Android'
        required: false
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS'
        required: false
        type: boolean
        default: true
      build_web:
        description: 'Build Web'
        required: false
        type: boolean
        default: true
      oauth2_client_id:
        description: 'OAuth2 client_id override (via --dart-define)'
        required: false
        type: string
        default: ''
      google_server_client_id:
        description: 'Google server/web OAuth client_id for native Google sign-in'
        required: false
        type: string
        default: '265397001887-hjrrjml6ekekmrjlg4ku4bsgtobgid85.apps.googleusercontent.com'
    secrets:
      ANDROID_SIGNING_KEY:
        required: false
      ANDROID_SIGNING_KEY_PASSWORD:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      BUILD_CERTIFICATE_BASE64:
        required: false
      P12_PASSWORD:
        required: false
      BUILD_PROVISION_PROFILE_BASE64:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      GOOGLE_SERVICES_JSON:
        required: false
      IOS_GOOGLE_SERVICES_PLIST:
        required: false

env:
  JAVA_VERSION: '17'

jobs:
  # Derive version from git tags when not explicitly provided
  prepare:
    name: Derive Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive version from git
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.1")
            DISTANCE=$(git rev-list "$(git describe --tags --abbrev=0 2>/dev/null)"..HEAD --count 2>/dev/null || echo "0")
            if [ "$DISTANCE" -gt "0" ]; then
              VERSION="${VERSION}-dev.${DISTANCE}"
            fi
          fi

          BUILD_NUMBER=$(git rev-list HEAD --count)
          PUBSPEC_BUILD_NUMBER=$(awk '/^version:/ { split($2, parts, "+"); print parts[2] }' ui/pubspec.yaml)
          if [ -n "$PUBSPEC_BUILD_NUMBER" ] && [ "$PUBSPEC_BUILD_NUMBER" -gt "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="$PUBSPEC_BUILD_NUMBER"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "## Version Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number**: $BUILD_NUMBER" >> $GITHUB_STEP_SUMMARY

  # Android Build
  build-android:
    name: Android (${{ inputs.build_type }})
    needs: [prepare]
    if: inputs.build_android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ui

    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
      aab_path: ${{ steps.build.outputs.aab_path }}

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup
        with:
          java-version: ${{ env.JAVA_VERSION }}

      # Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('ui/android/**/*.gradle*', 'ui/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: |
          # Accept either base64-encoded or raw JSON content
          if printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d >/tmp/gs.json 2>/dev/null \
             && head -c1 /tmp/gs.json | grep -q '{'; then
            mv /tmp/gs.json android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi

      - name: Setup Android signing
        if: inputs.build_type == 'release'
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > android/app/keystore.jks
            cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$SIGNING_KEY_PASSWORD
          keyAlias=upload
          storeFile=keystore.jks
          EOF
          fi

      - name: Build Android
        id: build
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          OAUTH2_CLIENT_ID: ${{ inputs.oauth2_client_id }}
          GOOGLE_SERVER_CLIENT_ID: ${{ inputs.google_server_client_id }}
        run: |
          BUILD_ARGS="${{ inputs.build_type == 'release' && '--release --shrink' || '--debug' }}"
          BUILD_ARGS="$BUILD_ARGS --build-name=$APP_VERSION --build-number=$BUILD_NUMBER"
          [ -n "$OAUTH2_CLIENT_ID" ] && BUILD_ARGS="$BUILD_ARGS --dart-define=OAUTH2_CLIENT_ID=$OAUTH2_CLIENT_ID"
          [ -n "$GOOGLE_SERVER_CLIENT_ID" ] && BUILD_ARGS="$BUILD_ARGS --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"

          flutter build apk $BUILD_ARGS

          if [ "${{ inputs.build_type }}" == "release" ]; then
            flutter build appbundle $BUILD_ARGS
            echo "aab_path=ui/build/app/outputs/bundle/release/app-release.aab" >> $GITHUB_OUTPUT
            echo "apk_path=ui/build/app/outputs/flutter-apk/app-release.apk" >> $GITHUB_OUTPUT
          else
            echo "apk_path=ui/build/app/outputs/flutter-apk/app-debug.apk" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-${{ inputs.environment }}
          path: ${{ steps.build.outputs.apk_path }}
          retention-days: ${{ inputs.environment == 'staging' && 1 || 3 }}

      - name: Upload AAB
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: android-aab-${{ inputs.environment }}
          path: ${{ steps.build.outputs.aab_path }}
          retention-days: ${{ inputs.environment == 'staging' && 1 || 3 }}

  # iOS Build
  build-ios:
    name: iOS (${{ inputs.build_type }})
    needs: [prepare]
    if: inputs.build_ios
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ui

    outputs:
      ipa_path: ${{ steps.build.outputs.ipa_path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup

      # Cache CocoaPods
      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: ui/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ui/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Setup iOS project
        run: |
          if [ ! -d "ios/Runner.xcodeproj" ]; then
            echo "iOS project not found or incomplete, regenerating..."
            rm -rf ios
            flutter create --platforms=ios .
          fi
          cd ios
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" Runner.xcodeproj/project.pbxproj 2>/dev/null || true

      - name: Setup iOS Firebase config
        env:
          IOS_GOOGLE_SERVICES_PLIST: ${{ secrets.IOS_GOOGLE_SERVICES_PLIST }}
        if: env.IOS_GOOGLE_SERVICES_PLIST != ''
        run: |
          # Accept either base64-encoded or raw plist XML
          if printf '%s' "$IOS_GOOGLE_SERVICES_PLIST" | base64 -d >/tmp/gs.plist 2>/dev/null \
             && head -c5 /tmp/gs.plist | grep -q '<'; then
            mv /tmp/gs.plist ios/Runner/GoogleService-Info.plist
          else
            printf '%s' "$IOS_GOOGLE_SERVICES_PLIST" > ios/Runner/GoogleService-Info.plist
          fi
          gem install --no-document xcodeproj
          ruby <<'RUBY'
          require 'xcodeproj'
          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'Runner' }
          abort 'Runner target not found' unless target
          plist_path = 'GoogleService-Info.plist'
          group = project.main_group['Runner'] || project.main_group
          existing = group.files.find { |f| f.path == plist_path }
          file_ref = existing || group.new_reference(plist_path)
          unless target.resources_build_phase.files_references.include?(file_ref)
            target.resources_build_phase.add_file_reference(file_ref)
          end
          project.save
          puts "GoogleService-Info.plist linked into Runner resources."
          RUBY

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update || pod install

      - name: Setup iOS signing
        if: inputs.build_type == 'release' && inputs.environment == 'production'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
          fi

      - name: Build iOS
        id: build
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          OAUTH2_CLIENT_ID: ${{ inputs.oauth2_client_id }}
          GOOGLE_SERVER_CLIENT_ID: ${{ inputs.google_server_client_id }}
        run: |
          if [ "${{ inputs.build_type }}" == "release" ] && [ "${{ inputs.environment }}" == "production" ]; then
            BUILD_ARGS="--release"
          else
            BUILD_ARGS="${{ inputs.build_type == 'release' && '--release' || '--debug' }} --no-codesign"
          fi
          BUILD_ARGS="$BUILD_ARGS --build-name=$APP_VERSION --build-number=$BUILD_NUMBER"
          [ -n "$OAUTH2_CLIENT_ID" ] && BUILD_ARGS="$BUILD_ARGS --dart-define=OAUTH2_CLIENT_ID=$OAUTH2_CLIENT_ID"
          [ -n "$GOOGLE_SERVER_CLIENT_ID" ] && BUILD_ARGS="$BUILD_ARGS --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"

          flutter build ios $BUILD_ARGS

          mkdir -p build/ios/ipa
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cd build/ios/ipa
            mkdir -p Payload
            cp -r ../iphoneos/Runner.app Payload/
            zip -r Runner.ipa Payload
            rm -rf Payload
          fi

          echo "ipa_path=ui/build/ios/ipa/Runner.ipa" >> $GITHUB_OUTPUT

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-${{ inputs.environment }}
          path: ui/build/ios/ipa/
          retention-days: ${{ inputs.environment == 'staging' && 1 || 3 }}

  # Web Build
  build-web:
    name: Web (${{ inputs.build_type }})
    needs: [prepare]
    if: inputs.build_web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup

      - name: Clean stale build artifacts
        run: rm -rf .dart_tool/flutter_build/

      - name: Build Web
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          OAUTH2_CLIENT_ID: ${{ inputs.oauth2_client_id }}
          GOOGLE_SERVER_CLIENT_ID: ${{ inputs.google_server_client_id }}
        run: |
          BUILD_ARGS="${{ inputs.build_type == 'release' && '--release' || '--profile' }} --base-href / --build-name=$APP_VERSION --build-number=$BUILD_NUMBER"
          [ -n "$OAUTH2_CLIENT_ID" ] && BUILD_ARGS="$BUILD_ARGS --dart-define=OAUTH2_CLIENT_ID=$OAUTH2_CLIENT_ID"
          [ -n "$GOOGLE_SERVER_CLIENT_ID" ] && BUILD_ARGS="$BUILD_ARGS --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"
          flutter build web $BUILD_ARGS

      - name: Upload Web
        uses: actions/upload-artifact@v7
        with:
          name: web-build-${{ inputs.environment }}
          path: ui/build/web/
          retention-days: ${{ inputs.environment == 'staging' && 1 || 3 }}

  # Linux Build
  build-linux:
    name: Linux (${{ inputs.build_type }})
    needs: [prepare]
    if: inputs.build_desktop
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        working-directory: .
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build libgtk-3-dev libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libcurl4-openssl-dev libwebkit2gtk-4.1-dev

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup

      - name: Build Linux
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          OAUTH2_CLIENT_ID: ${{ inputs.oauth2_client_id }}
          GOOGLE_SERVER_CLIENT_ID: ${{ inputs.google_server_client_id }}
        run: |
          BUILD_ARGS="${{ inputs.build_type == 'release' && '--release' || '--debug' }}"
          BUILD_ARGS="$BUILD_ARGS --build-name=$APP_VERSION --build-number=$BUILD_NUMBER"
          [ -n "$OAUTH2_CLIENT_ID" ] && BUILD_ARGS="$BUILD_ARGS --dart-define=OAUTH2_CLIENT_ID=$OAUTH2_CLIENT_ID"
          [ -n "$GOOGLE_SERVER_CLIENT_ID" ] && BUILD_ARGS="$BUILD_ARGS --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"
          flutter build linux $BUILD_ARGS

      - name: Package Linux bundle
        run: |
          BUILD_MODE=${{ inputs.build_type == 'release' && 'release' || 'debug' }}
          tar -czf $GITHUB_WORKSPACE/linux-bundle.tar.gz -C build/linux/x64/${BUILD_MODE}/bundle .

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundle-${{ inputs.environment }}
          path: linux-bundle.tar.gz
          retention-days: ${{ inputs.environment == 'staging' && 1 || 3 }}

  # Windows Build
  build-windows:
    name: Windows (${{ inputs.build_type }})
    needs: [prepare]
    if: inputs.build_desktop
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup

      - name: Build Windows
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          OAUTH2_CLIENT_ID: ${{ inputs.oauth2_client_id }}
          GOOGLE_SERVER_CLIENT_ID: ${{ inputs.google_server_client_id }}
        run: |
          $buildArgs = "${{ inputs.build_type == 'release' && '--release' || '--debug' }}"
          $buildArgs += " --build-name=$env:APP_VERSION --build-number=$env:BUILD_NUMBER"
          if ($env:OAUTH2_CLIENT_ID) { $buildArgs += " --dart-define=OAUTH2_CLIENT_ID=$env:OAUTH2_CLIENT_ID" }
          if ($env:GOOGLE_SERVER_CLIENT_ID) { $buildArgs += " --dart-define=GOOGLE_SERVER_CLIENT_ID=$env:GOOGLE_SERVER_CLIENT_ID" }
          flutter build windows $buildArgs
        shell: pwsh

      - name: Package Windows app
        run: |
          $buildMode = "${{ inputs.build_type == 'release' && 'Release' || 'Debug' }}"
          Compress-Archive -Path "build\windows\x64\runner\$buildMode\*" -DestinationPath "$env:GITHUB_WORKSPACE\windows-app.zip"
        shell: pwsh

      - name: Upload Windows app
        uses: actions/upload-artifact@v7
        with:
          name: windows-app-${{ inputs.environment }}
          path: windows-app.zip
          retention-days: ${{ inputs.environment == 'staging' && 1 || 3 }}

  # macOS Build
  build-macos:
    name: macOS (${{ inputs.build_type }})
    needs: [prepare]
    if: inputs.build_desktop
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: ./.github/actions/flutter-setup

      # Cache CocoaPods
      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: ui/macos/Pods
          key: macos-pods-${{ runner.os }}-${{ hashFiles('ui/macos/Podfile.lock') }}
          restore-keys: macos-pods-${{ runner.os }}-

      - name: Install CocoaPods
        run: cd macos && pod install --repo-update || pod install

      - name: Build macOS
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          OAUTH2_CLIENT_ID: ${{ inputs.oauth2_client_id }}
          GOOGLE_SERVER_CLIENT_ID: ${{ inputs.google_server_client_id }}
        run: |
          BUILD_ARGS="${{ inputs.build_type == 'release' && '--release' || '--debug' }}"
          BUILD_ARGS="$BUILD_ARGS --build-name=$APP_VERSION --build-number=$BUILD_NUMBER"
          [ -n "$OAUTH2_CLIENT_ID" ] && BUILD_ARGS="$BUILD_ARGS --dart-define=OAUTH2_CLIENT_ID=$OAUTH2_CLIENT_ID"
          [ -n "$GOOGLE_SERVER_CLIENT_ID" ] && BUILD_ARGS="$BUILD_ARGS --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID"
          flutter build macos $BUILD_ARGS

      - name: Package macOS app
        run: |
          BUILD_MODE=${{ inputs.build_type == 'release' && 'Release' || 'Debug' }}
          cd build/macos/Build/Products/${BUILD_MODE}
          zip -r ${GITHUB_WORKSPACE}/macos-app.zip *.app

      - name: Upload macOS app
        uses: actions/upload-artifact@v7
        with:
          name: macos-app-${{ inputs.environment }}
          path: macos-app.zip
          retention-days: ${{ inputs.environment == 'staging' && 1 || 3 }}
