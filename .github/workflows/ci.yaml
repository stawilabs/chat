# Unified CI — handles both Go backend and Flutter UI (auto-detected)
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: gotesttools/gotestfmt-action@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: go test -p 1 -timeout 20m -json -v ./... 2>&1 | gotestfmt -hide all
  lint:
    uses: antinvestor/common/.github/workflows/golangci-lint.yml@main
  flutter:
    uses: antinvestor/common/.github/workflows/flutter-ci.yml@main
